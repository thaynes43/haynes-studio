[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "haynes-studio"
version = "0.1.0.dev0"
description = "Haynes Studio: tooling for short-form comedy videos on in-cluster services."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    # Checks the shipped JSON Schema files (contract section 13).
    "jsonschema>=4.23,<5",
    # Resolves references between the shipped schema files offline (story 404);
    # jsonschema 4.23 needs at least 0.28.4.
    "referencing>=0.28.4,<1",
    # Media libraries of the stack pin (contract section 13), at the versions the PoC
    # is known to work with (docs/reference/services.md). Stories 380 and 381 are the
    # first to use them: arrays, images, audio and video containers, and an ffmpeg
    # binary, because session pods have no system ffmpeg.
    "numpy>=2.4,<3",
    "Pillow>=13,<14",
    "av>=18.1,<19",
    "imageio-ffmpeg>=0.7,<0.8",
]

[project.scripts]
studio = "haynes_studio.cli:main"

[dependency-groups]
# Test and development tools only. A story that needs a runtime library adds it to
# [project].dependencies and the lock (docs/process/testing.md).
dev = [
    "pytest>=9.2,<10",
    "psycopg[binary]>=3.3,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/haynes_studio"]

[tool.uv]
# Session pods have no interpreter downloads; CI provides its own Python.
python-downloads = "never"

[tool.pytest.ini_options]
minversion = "9.2"
testpaths = ["tests"]
# Serial by contract (docs/contracts/studio-contracts-v1.md section 14): no xdist.
# -ra lists every skip with its reason; --tb=short keeps failures to code and path.
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short", "-p", "no:xdist"]
# The db and live markers are registered by tests/support/plugin.py.
xfail_strict = true
filterwarnings = ["error"]
