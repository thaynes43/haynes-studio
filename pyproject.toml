[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "haynes-studio"
version = "0.1.0.dev0"
description = "Haynes Studio: tooling for short-form comedy videos on in-cluster services."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.13"
dependencies = [
    # Checks the shipped JSON Schema files (contract section 13).
    "jsonschema>=4.23,<5",
    # Resolves references between the shipped schema files offline (story 404);
    # jsonschema 4.23 needs at least 0.28.4.
    "referencing>=0.28.4,<1",
    # Media libraries of the stack pin (contract section 13), at the versions the PoC
    # is known to work with (docs/reference/services.md). Stories 380 and 381 are the
    # first to use them: arrays, images, audio and video containers, and an ffmpeg
    # binary, because session pods have no system ffmpeg.
    "numpy>=2.4,<2.5",  # one version for Python 3.11 and 3.12 (2.5 needs 3.12)
    "Pillow>=13,<14",
    "av>=18.1,<19",
    "imageio-ffmpeg>=0.7,<0.8",
    # What the PoC's layered code already uses (contract section 13), locked ahead of
    # story 426, which ports it: scipy for chroma keying (poc/cutout.py, ndimage) and
    # OpenCV for the tracked lettering decal (poc/decal.py: ECC, inpaint, warp).
    "scipy>=1.16,<1.17",
    "opencv-python-headless>=4.12,<5",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.34,<1",
    "psycopg[binary]>=3.3,<4",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.10,<3",
    "mcp>=1.30,<2",
]

[project.scripts]
studio = "haynes_studio.cli:main"
studio-api = "haynes_studio.api.__main__:main"
studio-api-migrate = "haynes_studio.db.migrate:main"
studio-api-admin = "haynes_studio.api.key_admin:main"
studio-mcp = "haynes_studio.mcp.__main__:main"
studio-worker = "haynes_studio.queue.worker:main"
studio-matting = "haynes_studio.matting.__main__:main"
studio-segmentation = "haynes_studio.segmentation.__main__:main"

[dependency-groups]
# Test and development tools only. A story that needs a runtime library adds it to
# [project].dependencies and the lock (docs/process/testing.md).
dev = [
    "httpx2>=2,<3",
    "pytest>=9.2,<10",
]
matting = [
    "jsonschema>=4.23,<5",
    "numpy>=2.4,<2.5",
    "Pillow>=13,<14",
    "scipy>=1.16,<1.17",
    "onnxruntime==1.32.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

segmentation = [
    "jsonschema>=4.23,<5",
    "numpy>=2.4,<2.5",
    "Pillow==13.0.0",
    "torch==2.14.1+cpu; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision==0.29.1+cpu; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "transformers==5.24.1; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "safetensors==0.8.0; python_version == '3.12' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = { url = "https://download-r2.pytorch.org/whl/cpu/torch-2.14.1%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl" }
torchvision = { url = "https://download-r2.pytorch.org/whl/cpu/torchvision-0.29.1%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src/haynes_studio"]

[tool.uv]
# Session pods have no interpreter downloads; CI provides its own Python.
python-downloads = "never"

[tool.pytest.ini_options]
minversion = "9.2"
testpaths = ["tests"]
# Serial by contract (docs/contracts/studio-contracts-v1.md section 14): no xdist.
# -ra lists every skip with its reason; --tb=short keeps failures to code and path.
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short", "-p", "no:xdist"]
# The db and live markers are registered by tests/support/plugin.py.
xfail_strict = true
filterwarnings = ["error"]
