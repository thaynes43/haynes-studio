<meta charset="utf-8">
<title>Haynes Studio Storyboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}
/* Layout: a slate-dark sticky header over a cool storyboard-paper ground; one gutter wrapper;
   boards are numbered panels; non-photo-blue dashed callouts carry the API spec;
   china-marker red circles only what is still undecided. */
:root{
  --paper:#ECEFEC; --sheet:#FAFBF9; --sheet-2:#F1F4F2; --ink:#21262B; --ink-2:#525B64; --ink-3:#76808A;
  --line:#CDD6DC; --line-2:#AEBBC5;
  --head:#20252A; --head-fg:#E9ECE8; --head-mute:#9AA5AE;
  --blue:#3D8DC2; --blue-bg:#E3EFF7; --blue-ink:#1D5C86;
  --red:#C2362A; --red-bg:#FAE9E6;
  --ok:#2C7A4D; --ok-bg:#E1F0E6; --on-ok:#FFFFFF;
  --warn:#94600E; --warn-bg:#FAEFD6;
  --btn:#21262B; --btn-fg:#FAFBF9; --focus:#3D8DC2; --on-spk:#FFFFFF;
  --m-talk:#1D6A96; --m-react:#7A5A1E; --m-whole:#3F6B47;
  --spk-a:#9C7A22; --spk-b:#6E4E9E; --spk-c:#1F7A88; --spk-d:#B9497A;
  --shadow:0 1px 0 rgba(33,38,43,.05),0 3px 10px rgba(33,38,43,.06);
  --il-sky:#C8D5DD; --il-mist:#DCE4E8; --il-pine:#4C6A5A; --il-pine-2:#6E8A7B; --il-ground:#D6DDDA; --il-frost:#EEF3F4;
  --il-log:#6A4E39; --il-log-2:#53402F; --il-moss:#6E8F4C; --il-moss-2:#56733A; --il-fire:#E7833A; --il-fire-2:#F5C651;
  --il-stone:#8A908E; --il-lean:#7B6551; --il-lean-2:#5E4C3C;
  --il-jacket:#2447A6; --il-jacket-2:#162F73; --il-letter:#F1C12E; --il-stripe:#F3F3EE; --il-top:#D9708F;
  --il-feature:#2A2124; --il-skin-a:#F0C8AD; --il-skin-b:#6C452F; --il-skin-c:#C78C60; --il-skin-d:#EFB5B4;
  --il-hair-a:#D7CBAE; --il-hair-b:#1F1A19; --il-hair-c:#984826; --il-hair-d:#EEEADC;
  --il-bow:#E56C98; --il-twig:#654E36; --il-squishy:#F2CF4C; --il-star-p:#EC8DB3; --il-star-b:#7DB2E6;
  --il-wall:#E4DED3; --il-wall-2:#B9AF9F; --il-counter:#CDBFAE; --il-counter-2:#A8977F; --il-water:#7EA6BB; --il-chroma:#58B368;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14181C; --sheet:#1C2227; --sheet-2:#232A30; --ink:#E4E7E2; --ink-2:#A7AFB6; --ink-3:#7E8891;
    --line:#2F3A43; --line-2:#43515C;
    --head:#0E1114; --head-fg:#E4E7E2; --head-mute:#8D98A2;
    --blue:#6CB3E0; --blue-bg:#152B39; --blue-ink:#A3D2F0;
    --red:#FF7B67; --red-bg:#3A1E1A;
    --ok:#5FC68A; --ok-bg:#163024; --on-ok:#0D1A12;
    --warn:#E9B657; --warn-bg:#382B12;
    --btn:#E4E7E2; --btn-fg:#14181C; --focus:#6CB3E0; --on-spk:#101418;
    --m-talk:#7DC0E6; --m-react:#D9B46A; --m-whole:#8CC496;
    --spk-a:#D7B256; --spk-b:#AB8EDA; --spk-c:#5DBBC8; --spk-d:#EA88AE;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 3px 12px rgba(0,0,0,.25);
    --il-sky:#3A4955; --il-mist:#45545F; --il-pine:#2C4337; --il-pine-2:#3B5547; --il-ground:#5A6461; --il-frost:#717C7B;
    --il-log:#4F392A; --il-log-2:#3C2B20; --il-moss:#557140; --il-moss-2:#425A31;
    --il-stone:#6E7472; --il-lean:#5E4C3D; --il-lean-2:#463829;
    --il-jacket:#2E57C0; --il-jacket-2:#1A367F;
    --il-wall:#5B564E; --il-wall-2:#7B7365; --il-counter:#6F6455; --il-counter-2:#8C7E6B; --il-water:#4E7487; --il-chroma:#3E8A4C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14181C; --sheet:#1C2227; --sheet-2:#232A30; --ink:#E4E7E2; --ink-2:#A7AFB6; --ink-3:#7E8891;
  --line:#2F3A43; --line-2:#43515C;
  --head:#0E1114; --head-fg:#E4E7E2; --head-mute:#8D98A2;
  --blue:#6CB3E0; --blue-bg:#152B39; --blue-ink:#A3D2F0;
  --red:#FF7B67; --red-bg:#3A1E1A;
  --ok:#5FC68A; --ok-bg:#163024; --on-ok:#0D1A12;
  --warn:#E9B657; --warn-bg:#382B12;
  --btn:#E4E7E2; --btn-fg:#14181C; --focus:#6CB3E0; --on-spk:#101418;
  --m-talk:#7DC0E6; --m-react:#D9B46A; --m-whole:#8CC496;
  --spk-a:#D7B256; --spk-b:#AB8EDA; --spk-c:#5DBBC8; --spk-d:#EA88AE;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 3px 12px rgba(0,0,0,.25);
  --il-sky:#3A4955; --il-mist:#45545F; --il-pine:#2C4337; --il-pine-2:#3B5547; --il-ground:#5A6461; --il-frost:#717C7B;
  --il-log:#4F392A; --il-log-2:#3C2B20; --il-moss:#557140; --il-moss-2:#425A31;
  --il-stone:#6E7472; --il-lean:#5E4C3D; --il-lean-2:#463829;
  --il-jacket:#2E57C0; --il-jacket-2:#1A367F;
  --il-wall:#5B564E; --il-wall-2:#7B7365; --il-counter:#6F6455; --il-counter-2:#8C7E6B; --il-water:#4E7487; --il-chroma:#3E8A4C;
  color-scheme: dark;
}

*,*::before,*::after{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.15rem;letter-spacing:.005em}
h2{font-size:1.2rem;text-transform:uppercase;letter-spacing:.06em}
h3{font-size:1rem;text-transform:uppercase;letter-spacing:.06em}
p{margin:0}
a{color:inherit}
code,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mono{font-size:.86em}
.muted{color:var(--ink-3)}
:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
button{font:inherit;color:inherit}
ul,ol{margin:0;padding:0;list-style:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-fg)}
.top-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.slate{width:26px;height:20px;border:2px solid var(--head-fg);border-radius:2px;position:relative;flex:none;background:var(--head)}
.slate::before{content:"";position:absolute;left:-2px;right:-2px;top:-8px;height:7px;border:2px solid var(--head-fg);border-radius:2px;background:repeating-linear-gradient(135deg,var(--head-fg) 0 4px,var(--head) 4px 8px);transform:rotate(-8deg);transform-origin:left bottom}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.lan{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--head-mute);border:1px solid var(--head-mute);border-radius:2px;padding:1px 5px;white-space:nowrap}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 420px;order:3}
.nav::-webkit-scrollbar{display:none}
.nav a{font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.06em;text-transform:uppercase;color:var(--head-mute);text-decoration:none;padding:8px 10px 6px;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.nav a:hover{color:var(--head-fg)}
.nav a[aria-current="page"]{color:var(--head-fg);border-bottom-color:var(--red)}
.nav .badge{font-family:var(--f-mono);font-size:.7rem;letter-spacing:0;background:var(--head-fg);color:var(--head);border-radius:2px;padding:0 4px}
.spec-toggle{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--head-fg);cursor:pointer;margin-left:auto;white-space:nowrap}
.spec-toggle input{width:18px;height:18px;accent-color:var(--blue)}
@media (min-width:1000px){.nav{order:0;flex:1 1 auto}}

/* page */
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 64px;max-width:1280px;margin:0 auto}
.example{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:.84rem;color:var(--ink-2);padding-block:0 14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.stamp{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--red);border:1.5px solid var(--red);padding:1px 6px;border-radius:2px;transform:rotate(-1.5deg);display:inline-block}
.screen{display:flex;flex-direction:column;gap:18px}
.screen-head{display:flex;flex-direction:column;gap:8px}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.eyebrow a{color:var(--ink-2)}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--ink-2);font-size:.9rem}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.02em;border:1px solid var(--line-2);color:var(--ink-2);padding:1px 6px;border-radius:2px;background:var(--sheet)}
.tag-d{color:var(--blue-ink);border-color:var(--blue)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:3px}
.pad{padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.stack-sm{display:flex;flex-direction:column;gap:6px}
.lbl{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.big{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.hint{font-size:.84rem;color:var(--ink-2)}
.err{font-size:.86rem;color:var(--red)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border:1.5px solid var(--ink);border-radius:5px;background:transparent;color:var(--ink);font-weight:700;font-size:.9rem;line-height:1.1;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sheet-2)}
.btn-primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.btn-primary:hover:not(:disabled){background:var(--btn);opacity:.9}
.btn-ok{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.btn-ok:hover:not(:disabled){background:var(--ok);opacity:.9}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn-quiet{border-color:transparent;color:var(--ink-2)}
.btn-sm{min-height:32px;padding:5px 10px;font-size:.82rem}
.btn-icon{min-width:34px;padding:5px 7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;flex:none}
.in{font:inherit;font-size:.95rem;padding:8px 10px;border:1px solid var(--line-2);border-radius:4px;background:var(--sheet);color:var(--ink);min-width:0;max-width:100%}
.in:disabled{opacity:.6}
textarea.in{resize:vertical;min-height:70px;width:100%}
select.in{padding-right:28px}
.in-num{width:5.5em}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.flabel{font-size:.8rem;font-weight:700;color:var(--ink-2)}
.inline-field{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--ink-2)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.9rem}
.check input{width:18px;height:18px;accent-color:var(--ink)}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:5px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:700;font-size:.86rem;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}

/* pills and chips */
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-mono);font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill-ok{color:var(--ok);background:var(--ok-bg)}
.pill-warn{color:var(--warn);background:var(--warn-bg)}
.pill-bad{color:var(--red);background:var(--red-bg)}
.pill-idle{color:var(--ink-2);background:var(--sheet-2)}
.pill-run{color:var(--blue-ink);background:var(--blue-bg)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:2px;border:1.5px solid currentColor;white-space:nowrap}
.m-talk{color:var(--m-talk)} .m-react{color:var(--m-react)} .m-whole{color:var(--m-whole)} .m-legacy{color:var(--ink-3)}
.m-react{border-style:dashed} .m-whole{border-style:double;border-width:3px}
.spk{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 4px;border-radius:2px;font-family:var(--f-mono);font-size:.74rem;font-weight:600;color:var(--on-spk);flex:none}
.spk-a{background:var(--spk-a)} .spk-b{background:var(--spk-b)} .spk-c{background:var(--spk-c)} .spk-d{background:var(--spk-d)}
.agent-flag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;color:var(--warn);background:var(--warn-bg);border:1.5px dashed var(--warn);padding:2px 8px;border-radius:2px}

/* open questions */
.openqs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:10px}
.openq{border:1.5px dashed var(--red);background:var(--red-bg);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.9rem;min-width:0}
.oq-tag{align-self:flex-start;font-family:var(--f-mono);font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--red);border:2px solid var(--red);border-radius:50%/60%;padding:2px 10px;transform:rotate(-2deg)}
.oq-inline{font-family:var(--f-mono);font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--red);border:1.5px solid var(--red);border-radius:50%/60%;padding:1px 7px;white-space:nowrap}

/* spec notes */
#app:not(.show-spec) .spec{display:none}
.spec{display:flex;gap:10px;align-items:flex-start;font-family:var(--f-mono);font-size:.78rem;line-height:1.55;color:var(--blue-ink);background:var(--blue-bg);border:1.5px dashed var(--blue);border-radius:3px;padding:9px 11px;min-width:0}
.spec-k{flex:none;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.66rem;border:1px solid var(--blue);padding:0 4px;border-radius:2px;margin-top:2px}
.spec div{min-width:0;overflow-wrap:anywhere}
.spec code{font-weight:600}
.spec ul{display:flex;flex-direction:column;gap:3px}

/* summary band */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1px;background:var(--line);border:1px solid var(--line-2);border-radius:3px;overflow:hidden}
.sum-cell{padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--sheet)}
.gauge{position:relative;height:12px;background:var(--sheet-2);border:1px solid var(--line-2);border-radius:2px;margin-top:4px}
.gauge .rng{position:absolute;top:0;bottom:0;background:var(--line);border-left:1px solid var(--ink-3);border-right:1px solid var(--ink-3)}
.gauge .mk{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);transform:translateX(-50%)}
.build-cell .btn{align-self:flex-start}
.confirm{border:1.5px solid var(--ink);background:var(--sheet);border-radius:3px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}

/* reel */
.reel-wrap{display:flex;flex-direction:column;gap:4px}
.reel{display:flex;height:46px;border:1.5px solid var(--ink);border-radius:2px;background:var(--sheet);overflow:hidden}
.reel button{flex-basis:0;min-width:0;border:0;border-right:1px solid var(--line-2);background:transparent;cursor:pointer;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 2px;font-family:var(--f-display);font-weight:700;font-size:1rem;color:var(--ink);box-shadow:inset 0 -5px 0 var(--line)}
.reel button:last-child{border-right:0}
.reel button.s-approved{box-shadow:inset 0 -5px 0 var(--ok)}
.reel button.s-review{box-shadow:inset 0 -5px 0 var(--warn);background:var(--warn-bg)}
.reel button.s-changes{box-shadow:inset 0 -5px 0 var(--red)}
.reel button span{font-family:var(--f-mono);font-size:.62rem;font-weight:400;color:var(--ink-3)}
.ruler{position:relative;height:16px;font-family:var(--f-mono);font-size:.66rem;color:var(--ink-3)}
.ruler span{position:absolute;top:0;transform:translateX(-50%)}
.ruler span:first-child{transform:none}
.ruler span.end{transform:translateX(-100%)}

/* boards */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:14px}
.board{background:var(--sheet);border:1px solid var(--line-2);border-radius:3px;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow)}
.board.is-review{border:1.5px dashed var(--warn)}
.board.is-changes{border:1.5px solid var(--red)}
.board.dragging{opacity:.45}
.board.drop-target{outline:3px solid var(--blue);outline-offset:2px}
.board-top{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);min-width:0}
.bnum{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums}
.btitle{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.grip{color:var(--ink-3);cursor:grab;display:none}
@media (hover:hover){.grip{display:inline-flex}}
.board-body{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;padding:10px}
.thumb{display:block;aspect-ratio:9/16;max-width:100%;border:1.5px solid var(--ink);background:var(--sheet-2);overflow:hidden;position:relative}
.thumb svg,.photo-big svg,.fs-btn svg,.athumb svg,.poster svg{display:block;width:100%;height:100%}
.thumb .nophoto,.photo-big .nophoto{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-size:.72rem;color:var(--ink-3);background:repeating-linear-gradient(45deg,var(--sheet-2) 0 6px,var(--sheet) 6px 12px)}
.board-info{min-width:0;display:flex;flex-direction:column;gap:7px}
.lines-mini{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.lines-mini li{display:flex;gap:6px;align-items:flex-start;min-width:0}
.lines-mini .lt{min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lines-mini .more{color:var(--ink-3);font-size:.8rem}
.board-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.82rem;color:var(--ink-2)}
.board-actions{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:1px solid var(--line);align-items:center}
.board-actions .spacer{flex:1}

  if(d.t==='wave')return waveSVG(d.seed);
  if(d.t==='motion')return (d.d?scene({set:'chroma',layout:'center',inFrame:[{d:d.d,e:d.e}]}):scene({set:d.set,layout:'empty',inFrame:[]}))+'<span class="loop">LOOP</span>';
  return '';
}
function photoThumb(v,big){

}

  const picker=S.ui.pickerOpen&&!ro?'<div class="picker" id="picker"><div class="kinds" role="group" aria-label="Asset kind">'+[['cast','Cast'],['costume','Costumes'],['set','Sets'],['prop','Props']].map(k=>'<button id="pk-'+k[0]+'" data-act="picker-kind" data-k="'+k[0]+'" aria-pressed="'+(S.ui.pickerKind===k[0])+'">'+k[1]+'</button>').join('')+'</div><div class="picker-list">'+
    ASSETS.filter(a=>a.kind===S.ui.pickerKind).map(a=>{const has=a.kind==='cast'?b.inFrame.some(f=>DOLLS[f.d].asset===a.id):b.assets.indexOf(a.id)>=0;return '<button id="pick-'+a.id+'" data-act="picker-add" data-asset="'+a.id+'" '+(has?'disabled':'')+'><span>'+esc(a.name)+'</span><span class="mono muted">v'+a.ver+(has?' · added':'')+'</span></button>';}).join('')+'</div></div>':'';
  const photoCol='<div class="bcol">'+
    '<figure class="photo-big" aria-label="Reference photo">'+photoThumb(shown,true)+(b.photoStale&&!pv?'<span class="stale">The cast or framing changed. Generate a new version to update the photo.</span>':'')+'</figure>'+

      (gen?'<div class="stack-sm" role="status"><span class="hint">Making v'+(b.photo.versions.length+1)+'…</span><div class="progress"><i id="gen-bar" style="width:'+S.ui.genPct+'%"></i></div></div>':'')+

      spec('<ul><li><code>POST /boards/{id}/photos {asset_refs: [{asset_id, version, expression?}], prompt, seed}</code> queues an image job; the result appends a photo version with its provenance.</li><li><code>PUT /boards/{id}/photo {version}</code> picks the version in use (revert). Versions are never deleted.</li></ul>')+
    '</div></div>';
  // main column
  const starts=lineStarts(b);
  const lineRows=b.lines.map((l,k)=>{const who=DOLLS[l.who];const inF=b.inFrame.some(f=>f.d===l.who);
    return '<li class="line-row"><div class="line-ctl"><span class="lnum">'+(k+1)+'</span>'+

      '<button class="btn btn-sm btn-icon" id="play-'+k+'" data-act="play-line" data-i="'+k+'" aria-label="Play line '+(k+1)+' voice preview">'+ICON.play+'</button>'+
      '<span class="playbar" aria-hidden="true"><i id="pbar-'+k+'"></i></span>'+
      '<span class="ldur mono" id="ldur-'+k+'">'+l.dur.toFixed(2)+' s</span><span class="meas" id="lmeas-'+k+'">'+(l.meas?'measured':'estimated')+'</span>'+
      (ro?'':'<button class="btn btn-sm btn-quiet btn-icon" id="ln-del-'+k+'" data-act="line-del" data-i="'+k+'" aria-label="Remove line '+(k+1)+'">'+ICON.x+'</button>')+
      '</div><label class="sr" for="ln-text-'+k+'">Line '+(k+1)+' text</label><input class="in line-text" id="ln-text-'+k+'" data-in="line-text" data-i="'+k+'" value="'+esc(l.text)+'"'+dis+'>'+

  const timing=b.lines.length?
    '<div class="row"><span class="inline-field"><label for="b-lead">First line starts at</label><input class="in in-num" type="number" step="0.05" min="0" id="b-lead" data-in="b-lead" value="'+b.lead+'"'+dis+'> s</span><span class="inline-field"><label for="b-tail">Hold after the last line</label><input class="in in-num" type="number" step="0.05" min="0.25" id="b-tail" data-in="b-tail" value="'+b.tail+'"'+dis+'> s</span></div>':
    '<div class="row"><span class="inline-field"><label for="b-fixed">Board length</label><input class="in in-num" type="number" step="0.1" min="0.5" id="b-fixed" data-in="b-fixed" value="'+b.fixed+'"'+dis+'> s</span><span class="hint">No lines, so you set the length.</span></div>';
  const cues=b.cues.map((c,k)=>'<li class="cue-row"><label class="sr" for="cue-snd-'+k+'">Cue '+(k+1)+' sound</label><select class="in" id="cue-snd-'+k+'" data-ch="cue-snd" data-i="'+k+'"'+dis+'>'+Object.keys(SOUNDS).map(s=>'<option value="'+s+'"'+(s===c.snd?' selected':'')+'>'+SOUNDS[s]+'</option>').join('')+'</select>'+
    (c.after!=null?'<span class="hint">after line '+(c.after+1)+' + '+(c.off||0).toFixed(2)+' s ('+cueAt(b,c).toFixed(2)+' s)</span>':'<span class="inline-field"><label for="cue-at-'+k+'">at</label><input class="in in-num" type="number" step="0.05" min="0" id="cue-at-'+k+'" data-in="cue-at" data-i="'+k+'" value="'+c.at+'"'+dis+'> s</span>')+
    (ro?'':'<button class="btn btn-sm btn-quiet btn-icon" id="cue-del-'+k+'" data-act="cue-del" data-i="'+k+'" aria-label="Remove cue '+(k+1)+'">'+ICON.x+'</button>')+'</li>').join('');
  const script='<section class="sec" aria-labelledby="h-script"><div class="sec-head"><h2 id="h-script">Script</h2><span class="mono" id="bdur-head">'+fmtS(boardDur(b))+'</span></div>'+
    '<div class="field"><label for="b-title">Board name</label><input class="in" id="b-title" data-in="b-title" value="'+esc(b.title)+'"'+dis+'></div>'+
    (b.legacyNote?'<p class="hint">'+esc(b.legacyNote)+'</p>':'')+
    '<ol class="line-list">'+lineRows+'</ol>'+(ro?'':'<div class="row"><button class="btn btn-sm" id="line-add" data-act="line-add">'+ICON.plus+'Add line</button><span class="hint">Voice previews are mocked here; in the studio they play the Kokoro take.</span></div>')+
    timing+'<div class="stack-sm"><span class="lbl">Line timeline and cues</span><div id="tl-wrap">'+timeline(b)+'</div></div>'+
    '<div class="stack-sm"><span class="lbl">Sound cues</span><ul>'+(cues||'<li class="hint">No cues.</li>')+'</ul>'+(ro?'':'<div class="row"><button class="btn btn-sm" id="cue-add" data-act="cue-add">'+ICON.plus+'Add cue</button></div>')+'</div>'+
    spec('<ul><li><code>PATCH /boards/{id} {lines: [{speaker, text, gap_s}], lead_s, tail_s, cues}</code> makes a new board version and resets approval.</li><li><code>POST /voice/previews {voice, text}</code> returns <code>{wav_url, duration_s}</code> from Kokoro. Measured durations set the board’s length; estimates are shown until then.</li></ul>')+'</section>';
  const avail=Object.keys(DOLLS).filter(d=>!b.inFrame.some(f=>f.d===d));
  const inframe='<section class="sec" aria-labelledby="h-frame"><div class="sec-head"><h2 id="h-frame">In frame</h2></div><ul>'+
    b.inFrame.map(f=>'<li class="inf-row"><span class="spk spk-'+f.d+'">'+DOLLS[f.d].name+'</span><span>'+esc(DOLLS[f.d].role)+'</span><label class="sr" for="inf-'+f.d+'">Expression for '+DOLLS[f.d].name+'</label><select class="in" id="inf-'+f.d+'" data-ch="inf-expr" data-d="'+f.d+'"'+dis+'>'+DOLLS[f.d].exprs.map(e=>'<option'+(e===f.e?' selected':'')+'>'+e+'</option>').join('')+'</select><span class="hint">'+(MOTION.has(f.d+':'+f.e)?'motion clip in library':'no motion clip yet')+'</span>'+(ro?'':'<button class="btn btn-sm btn-quiet btn-icon" id="inf-del-'+f.d+'" data-act="inf-del" data-d="'+f.d+'" aria-label="Take '+DOLLS[f.d].name+' out of frame">'+ICON.x+'</button>')+'</li>').join('')+
    (b.inFrame.length?'':'<li class="hint">Nobody in frame.</li>')+'</ul>'+
    '<div class="row">'+(avail.length&&!ro?'<span class="inline-field"><label for="inf-add">Add a doll</label><select class="in" id="inf-add" data-ch="inf-add"><option value="">Choose</option>'+avail.map(d=>'<option value="'+d+'">'+DOLLS[d].name+', '+DOLLS[d].role+'</option>').join('')+'</select></span>':'')+
    '<span class="inline-field"><label for="b-layout">Framing</label><select class="in" id="b-layout" data-ch="b-layout"'+dis+'>'+Object.keys(FRAMINGS).map(k=>'<option value="'+k+'"'+(k===b.layout?' selected':'')+'>'+FRAMINGS[k]+'</option>').join('')+'</select></span></div>'+
    '<p class="hint">Expressions are molded: one per photo, and they change only at cuts.</p></section>';
  const mc=m=>{const tmp=Object.assign({},b,{method:m});const p=boardPlan(tmp);
    if(m==='talk')return p.speakers.length?plural(p.chunks,'chunk')+' ('+p.speakers.length+' speaking × '+p.per+'), about '+fmtDur(p.gpu)+' of GPU':'No speaking doll in frame';
    if(m==='react')return (p.reused.length?'reuses '+plural(p.reused.length,'clip'):'')+(p.fresh.length?(p.reused.length?', ':'')+plural(p.fresh.length,'new clip'):'')+(b.inFrame.length?', about '+fmtDur(p.gpu)+' of GPU':'No dolls in frame');
    return plural(p.wfClips,'clip')+', about '+fmtDur(p.gpu)+' of GPU';};
  const sug=suggestedMethod(b);
  const methods='<section class="sec" aria-labelledby="h-method"><div class="sec-head"><h2 id="h-method">Method</h2><span class="hint">Format default for this board: '+METHODS[sug].label+'</span></div>'+
    (b.method==='legacy'?'<p class="hint">'+esc(METHODS.legacy.long)+'.</p>':'<div class="methods" role="radiogroup" aria-label="Method" id="methods">'+['talk','react','whole'].map(m=>'<label class="mcard'+(b.method===m?' is-on':'')+'" for="m-'+m+'"><span class="row"><input type="radio" name="method" id="m-'+m+'" value="'+m+'" data-ch="method"'+(b.method===m?' checked':'')+dis+'>'+methodChip(m)+(m===sug?'<span class="mono muted">default</span>':'')+'</span><span class="mt">'+METHODS[m].long+'</span><span class="md">'+METHODS[m].desc+'</span><span class="mc" id="mc-'+m+'">'+esc(mc(m))+'</span></label>').join('')+'</div>')+
    (b.method!==sug&&b.method!=='legacy'?'<p class="err">This differs from the format default. The override is recorded on the board.</p>':'')+
    spec('Methods follow the format’s shot types (D25): talking = layered speech-to-video (D24), reaction = layered image-to-video (D23), ambient = whole-frame. Cost per job type comes from the scheduler (E3): S2V about 4.2 min per 4.8 s chunk including cooldown, a doll clip about 4.6 min, whole-frame about 4.7 min per 5 s.')+'</section>';
  const motion='<section class="sec" aria-labelledby="h-motion"><div class="sec-head"><h2 id="h-motion">Motion</h2></div><div class="row">'+
    '<span class="inline-field"><label for="b-camera">Camera (compositor)</label><select class="in" id="b-camera" data-ch="camera"'+dis+'><option value="static"'+(b.camera==='static'?' selected':'')+'>Static</option><option value="push"'+(b.camera==='push'?' selected':'')+'>Push-in, 1.0 to 1.2</option><option value="drift"'+(b.camera==='drift'?' selected':'')+'>Slow drift right</option></select></span>'+
    '<label class="check" for="b-bounce"><input type="checkbox" id="b-bounce" data-ch="bounce"'+(b.bounce?' checked':'')+dis+'> Syllable-synced bounce</label></div>'+
    '<p class="hint">Camera moves run in the compositor; Wan ignores them in prompts (E0).</p></section>';
  const checks='<section class="sec" aria-labelledby="h-checks"><div class="sec-head"><h2 id="h-checks">Checks before the build</h2></div><ul class="checks" id="chk-wrap">'+checksHTML(b)+'</ul>'+
    spec('<code>GET /boards/{id}/checks</code>: wardrobe against the team costume spec, faces visible, lettering region found, speakers in frame, chunk fit. Run by the shepherd with E2 tools; technical only, never taste (D14).')+'</section>';
  const notes='<section class="sec" aria-labelledby="h-notes"><div class="sec-head"><h2 id="h-notes">Notes</h2></div><div class="notes">'+
    (b.notes.length?b.notes.map(nt=>'<div class="note by-'+(nt.who==='Tom'?'tom':nt.who==='Shepherd'?'shepherd':'agent')+'"><span class="who">'+esc(nt.who)+' · <span class="mono">'+esc(nt.when)+'</span></span><span>'+esc(nt.text)+'</span></div>').join(''):'<p class="hint">No notes yet.</p>')+'</div>'+
    (ro?'':'<div class="field"><label for="note-text">Add a note</label><textarea class="in" id="note-text" data-in="note-text" rows="2" placeholder="What should change?">'+esc(S.ui.noteText)+'</textarea></div><div class="row"><label class="check" for="note-agent"><input type="checkbox" id="note-agent" data-ch="note-agent"'+(S.ui.noteAgent?' checked':'')+'> Ask the staging agent to act on it</label><button class="btn btn-sm btn-primary" id="note-add" data-act="note-add">Add note</button></div>')+
    spec('<code>POST /boards/{id}/notes {text, ask_agent}</code>. With <code>ask_agent</code>, the staging agent answers by drafting a new board version marked for review.')+'</section>';
  const approve=ro?'':'<section class="sec"><div class="bstat" id="bstat-2">'+bstat(b,ro,true)+'</div>'+spec('<code>POST /boards/{id}/approve {version}</code> approves that exact board version. Any edit makes a new version that needs approval again.')+'</section>';
  return '<section class="screen" aria-labelledby="h1">'+head+banner+'<div class="bgrid">'+photoCol+'<div class="bcol">'+script+inframe+methods+motion+checks+notes+approve+'</div></div>'+
    spec('<code>GET /boards/{id}</code> returns one board version: <code>lines[]</code>, <code>in_frame[{asset_id, version, expression}]</code>, <code>assets[]</code>, method, framing, camera, cues, <code>photo {versions[], selected}</code>, review state, notes and checks.')+'</section>';
}
function bstat(b,ro){
  const blk=approveBlock(b);
  return statusPill(b)+(ro||b.status==='approved'?'':'<button class="btn btn-ok" id="appr-'+(arguments.length>2?'x':'')+'top" data-act="approve" data-id="'+b.id+'" '+(blk?'disabled':'')+'>Approve board</button>'+(blk?'<span class="hint">'+esc(blk)+'</span>':''));
}
function timeline(b){
  const d=boardDur(b);const s=lineStarts(b);
  let h='<div class="tl" role="img" aria-label="Timeline, '+fmtS(d)+'">';
  b.lines.forEach((l,k)=>{h+='<span class="tl-seg spk-'+l.who+'" style="left:'+(s[k]/d*100).toFixed(2)+'%;width:'+(l.dur/d*100).toFixed(2)+'%">'+DOLLS[l.who].name+'</span>';});
  b.cues.forEach(c=>{h+='<span class="tl-cue" style="left:'+(clamp(cueAt(b,c)/d,0,1)*100).toFixed(2)+'%" title="'+esc(SOUNDS[c.snd])+'"></span>';});
  h+='</div><div class="ruler">'+(function(){let r='';const step=d>8?2:1;for(let t=0;t<=d+.001;t+=step)r+='<span'+(t/d>.9&&t>0?' class="end"':'')+' style="left:'+(t/d*100).toFixed(1)+'%">'+t+'</span>';return r;})()+'</div>';
  h+='<div class="tl-legend"><span class="mono">'+fmtS(d)+'</span>'+(b.method==='talk'?'<span class="mono">'+Math.ceil(d/RATE.chunkSec)+' × 4.8 s chunks, '+Math.round(d*RATE.fps)+' frames at 16 fps</span>':'')+b.cues.map(c=>'<span>'+esc(SOUNDS[c.snd])+' at '+cueAt(b,c).toFixed(2)+' s</span>').join('')+'</div>';
  return h;
}
function checksHTML(b){
  const cur=photoCur(b);const out=[];const p=boardPlan(b);
  out.push(cur?(cur.check==='fail'?['fail','Wardrobe does not match the Yellowbirds costume spec on the photo in use.']:['pass','Wardrobe matches the Yellowbirds costume spec: sleeves, lettering, colours.']):['todo','No photo yet, so the wardrobe check has not run.']);
  if(b.inFrame.length)out.push(cur?['pass','Every face in frame is visible.']:['todo','Face check waits for a photo.']);
  if(b.inFrame.length&&cur)out.push(['pass','Lettering region found for the decal on every jacket.']);
  const off=b.lines.filter(l=>!b.inFrame.some(f=>f.d===l.who));
  if(b.lines.length)out.push(off.length?['warn','Speaker not in frame: '+[...new Set(off.map(l=>DOLLS[l.who].name))].join(', ')+'.']:['pass','Every speaker is in the photo.']);
  if(b.method==='talk'&&p.per)out.push(['info',fmtS(p.dur)+' fits '+p.per+' chunks ('+(p.per*RATE.chunkSec).toFixed(1)+' s rendered, then trimmed).']);
  if(b.photoStale)out.push(['warn','The photo is older than the cast or framing.']);
  return out.map(c=>'<li><span class="ck ck-'+c[0]+'">'+c[0]+'</span><span>'+esc(c[1])+'</span></li>').join('');
}

/* ---------- view: render ---------- */
function viewRender(){
  const R=S.render;
  const head=t=>'<div class="screen-head"><p class="eyebrow">Build</p><h1 id="h1" tabindex="-1">'+t+'</h1>'+tags(['E6 Storyboard UI','E3 scheduler and queue','E1 render engine'],['D2','D18','D24','D26','D9'])+'</div>';
  if(!R)return '<section class="screen" aria-labelledby="h1">'+head('No build running')+'<div class="empty"><p>Build a story from the story editor once every board is approved.</p><p class="hint">Last build: The Winter Menu, layered speech-to-video (E0), 2026-11-04. 22 speech-to-video chunks, about 1 h 45 m from first start to last finish.</p><a class="btn btn-primary" href="#story">Go to the story</a></div>'+
    spec('<code>GET /renders?state=running</code> lists active renders. Only one GPU-heavy build runs at a time under the Wan API’s compute lease (E3).')+'</section>';
  const t=R.t;const pct=clamp(t/R.total,0,1);
  const stateP=R.state==='running'?pill('run','Running'):R.state==='done'?pill('ok','Finished'):pill('bad','Cancelled');
  const rows=R.rows.map(r=>{
    const cancelled=R.state==='cancelled';
    const stg=(label,s,e)=>{let c=t>=e?'done':(t>=s?'active':'');if(cancelled&&c!=='done')c='skip';return '<span class="stg '+c+'">'+label+'</span>';};
    const p=r.p;const gpu=r.ge-r.gs;
    let detail='Waiting for the GPU queue.';
    if(t>=r.ce)detail='Done.';
    else if(t>=r.cs)detail='Compositing on the render worker.';
    else if(t>=r.gs&&gpu>0){const k=Math.floor((t-r.gs)/RATE.chunk);
      if(p.chunks&&k<p.chunks){const sp=p.speakers[Math.floor(k/p.per)];detail='Speech-to-video: chunk '+(k%p.per+1)+' of '+p.per+' for '+DOLLS[sp].name+', one 3090.';}
      else if(p.wfClips)detail='Whole-frame clip '+(Math.floor((t-r.gs)/RATE.wf)+1)+' of '+p.wfClips+'.';
      else detail='Making a new motion clip.';}
    else if(t<r.gs&&t>=r.vs)detail='Rendering voices.';
    if(t>=r.ge&&p.reused.length&&t<r.ce)detail='Reusing '+p.reused.map(x=>DOLLS[x.d].name+' '+x.e).join(', ')+' from the library. '+detail;
    if(cancelled&&t<r.ce)detail='Cancelled. Finished clips stay in the cache.';
    const bt=r.vs,be=r.ce;const bp=clamp((t-bt)/Math.max(.01,be-bt),0,1);
    return '<div class="r-row"><span class="bnum">'+pad2(r.i+1)+'</span><span class="thumb">'+photoThumb(r.photo)+'</span><div class="r-mid"><div class="row"><strong>'+esc(r.title)+'</strong>'+methodChip(r.method)+'</div>'+
      '<div class="stages">'+'<span class="stg done">Photo v'+(r.photo?r.photo.v:'-')+' pinned</span>'+stg('Voice',r.vs,r.ve)+stg('Clip'+(p.chunks?' · '+p.chunks+' ch':''),r.gs,r.ge)+stg('Composite',r.cs,r.ce)+'</div>'+
      '<div class="bar'+(bp>=1?' ok':'')+'"><i style="width:'+(bp*100).toFixed(1)+'%"></i></div><span class="r-detail">'+esc(detail)+'</span></div>'+
      '<span class="r-time">'+fmtDur(be-bt)+'</span></div>';}).join('');
  const asmDone=t>=R.total;const asmActive=t>=R.asmS&&!asmDone;

/* ---------- view: candidates ---------- */
function candChecks(c){
  const list=c.checks.slice();

  list.push({id:'fmt',label:'The format allows this account.',state:fmtOk?'pass':'fail',fix:fmtOk?'':'Allow the account in the format first.'});
  list.push({id:'disc',label:'AI-generated content label set for this platform.',state:c.disclose?'pass':'todo',toggle:true});

}
function candStory(c){return S.stories.find(s=>s.id===c.story);}

      '<div class="sheet pad stack"><h2>Publish gate</h2><p class="hint">Rights, licences and disclosure are checked before any drop.</p>'+gate+pub+

  const drops=S.drops.length?'<ul class="hist">'+S.drops.map(d=>'<li><span class="mono">'+esc(d.when)+'</span><span>'+esc(d.title)+' to '+esc(d.acct)+' (mock)</span></li>').join('')+'</ul>':'<p class="hint">No drops yet. Nothing has been published.</p>';

    spec('<code>GET /candidates?account=</code> returns candidates with their render, story revision and check results. A candidate is a render presented for one account.')+
  '</section>';
}

const ROUTES={stories:['Stories',viewStories],story:['Story',viewStory],board:['Board',viewBoard],render:['Render',viewRender],library:['Library',viewLibrary],formats:['Formats',viewFormats],candidates:['Candidates',viewCandidates]};
function renderNav(){
  const R=S.render;
  $('#nav').innerHTML=Object.keys(ROUTES).map(k=>'<a href="#'+k+'"'+(S.route===k?' aria-current="page"':'')+'>'+ROUTES[k][0]+(k==='render'&&R&&R.state==='running'?'<span class="badge" id="nav-badge">'+Math.floor(clamp(R.t/R.total,0,1)*100)+'%</span>':'')+'</a>').join('');
}
function render(){
  const ae=document.activeElement;const fid=ae&&ae.id&&ae!==document.body?ae.id:null;

  $('#main').innerHTML=ROUTES[S.route][1]();
  if(fid&&fid!=='main'){const el=document.getElementById(fid);if(el&&el!==document.activeElement){try{el.focus({preventScroll:true});}catch(e){}}}
}
function go(){
  const h=(location.hash||'').replace('#','');
  S.route=ROUTES[h]?h:'story';
  S.ui.previewV=null;S.ui.pickerOpen=false;S.ui.confirmRemove=null;S.ui.buildConfirm=false;S.ui.pubAsk=false;

}
let toastT=null;
function toast(msg,actHTML){
  const t=$('#toast');t.innerHTML='<span>'+esc(msg)+'</span>'+(actHTML||'');t.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},actHTML?8000:4500);
}

/* ---------- board editor refresh (no full re-render while typing) ---------- */
function refreshBoard(){
  const b=curBoard();if(!b||S.route!=='board')return;
  const tw=$('#tl-wrap');if(tw)tw.innerHTML=timeline(b);
  const bh=$('#bdur-head');if(bh)bh.textContent=fmtS(boardDur(b));
  b.lines.forEach((l,k)=>{const d=$('#ldur-'+k);if(d)d.textContent=l.dur.toFixed(2)+' s';const m=$('#lmeas-'+k);if(m)m.textContent=l.meas?'measured':'estimated';});
  ['talk','react','whole'].forEach(m=>{const el=$('#mc-'+m);if(el){const tmp=Object.assign({},b,{method:m});const p=boardPlan(tmp);
    el.textContent=m==='talk'?(p.speakers.length?plural(p.chunks,'chunk')+' ('+p.speakers.length+' speaking × '+p.per+'), about '+fmtDur(p.gpu)+' of GPU':'No speaking doll in frame'):m==='react'?((p.reused.length?'reuses '+plural(p.reused.length,'clip'):'')+(p.fresh.length?(p.reused.length?', ':'')+plural(p.fresh.length,'new clip'):'')+(b.inFrame.length?', about '+fmtDur(p.gpu)+' of GPU':'No dolls in frame')):plural(p.wfClips,'clip')+', about '+fmtDur(p.gpu)+' of GPU';}});
  const ck=$('#chk-wrap');if(ck)ck.innerHTML=checksHTML(b);

function startRender(st){
  const pl=storyPlan(st);
  const rows=pl.rows.map(r=>{const b=st.boards[r.i];return Object.assign({},r,{title:b.title,method:b.method,photo:photoCur(b)});});

  tick();
}
let tickT=null;
function tick(){
  clearInterval(tickT);
  tickT=setInterval(()=>{
    const R=S.render;if(!R||R.state!=='running'){clearInterval(tickT);return;}
    R.t+=0.5*R.speed/60;
    if(R.t>=R.total){R.t=R.total;R.state='done';clearInterval(tickT);finishRender(R);}
    if(S.route==='render')render();else{const nb=$('#nav-badge');if(nb)nb.textContent=Math.floor(clamp(R.t/R.total,0,1)*100)+'%';if(R.state==='done')renderNav();}
  },500);
}
function finishRender(R){
  const st=S.stories.find(s=>s.id===R.storyId);
  const accts=ACCOUNTS.filter(a=>S.format.accounts[a.id]).map(a=>a.id);
  const c={id:'cand-'+(++SEQ),story:R.storyId,title:R.title,label:'r'+R.rev+', studio build',len:Math.round(R.len*10)/10,acct:accts.length?accts:['acct-a'],made:'today',checks:null,disclose:false,feedback:[],published:null};
  c.checks=pubChecks(c);S.cands.unshift(c);R.candId=c.id;

}

  'pub-ask':()=>{S.ui.pubAsk=true;render();const y=$('#pub-yes');if(y)y.focus();},
  'pub-no':()=>{S.ui.pubAsk=false;render();},
  'pub-yes':()=>{const c=S.cands.find(x=>x.id===S.candSel);const ac=ACCOUNTS.find(a=>a.id===S.candAcct);c.published={acct:ac.name,when:'today'};S.drops.unshift({title:c.title,acct:ac.name,when:'today'});S.ui.pubAsk=false;render();toast('Published in the mockup. Nothing was sent anywhere.');},
  'fb-send':()=>{const c=S.cands.find(x=>x.id===S.candSel);const st=candStory(c);const text=S.ui.fbText.trim();
    if(!text){S.ui.fbErr='Write a note first.';render();const t=$('#fb-text');if(t)t.focus();return;}
    S.ui.fbErr='';st.rev+=1;st.revDraft=true;const b=S.ui.fbBoard?st.boards.find(x=>x.id===S.ui.fbBoard):null;
    st.revisions.push({r:st.rev,date:'draft',what:'Opened from candidate feedback'+(b?' on board '+(bIndex(st,b.id)+1):'')+'.',tom:text,quoted:true});
    if(b){b.notes.push({who:'Tom',text,when:'candidate feedback'});b.status='changes';}
    c.feedback.push({text,where:b?'Board '+(bIndex(st,b.id)+1):'Whole story',rev:st.rev});S.ui.fbText='';render();
    toast('Sent. '+st.title+' now has an r'+st.rev+' draft'+(b?' with your note on board '+(bIndex(st,b.id)+1):'')+'.');}
};

const CH={
  'spec-toggle':(el)=>{S.spec=el.checked;$('#app').classList.toggle('show-spec',S.spec);},
  'draft-count':(el)=>{S.ui.draftCount=el.value;},
  'draft-pos':(el)=>{S.ui.draftPos=el.value;},
  'line-who':(el)=>{const b=curBoard();b.lines[+el.dataset.i].who=el.value;b.lines[+el.dataset.i].meas=false;markEdited(b);render();},
  'inf-expr':(el)=>{const b=curBoard();const f=b.inFrame.find(x=>x.d===el.dataset.d);f.e=el.value;b.photoStale=!!photoCur(b);markEdited(b);render();},
  'inf-add':(el)=>{if(!el.value)return;const b=curBoard();b.inFrame.push({d:el.value,e:DOLLS[el.value].exprs[0]});b.photoStale=!!photoCur(b);if(b.methodAuto)b.method=suggestedMethod(b);markEdited(b);render();},
  'b-layout':(el)=>{const b=curBoard();b.layout=el.value;b.photoStale=!!photoCur(b);markEdited(b);render();},
  'method':(el)=>{const b=curBoard();b.method=el.value;b.methodAuto=false;markEdited(b);render();},
  'camera':(el)=>{const b=curBoard();b.camera=el.value;markEdited(b);render();},
  'bounce':(el)=>{const b=curBoard();b.bounce=el.checked;markEdited(b);render();},
  'cue-snd':(el)=>{const b=curBoard();b.cues[+el.dataset.i].snd=el.value;markEdited(b);render();},
  'note-agent':(el)=>{S.ui.noteAgent=el.checked;},
  'lib-label':(el)=>{S.lib.label=el.value;render();},
  'fmt-method':(el)=>{fmtTouch();const sh=S.format.shots.find(x=>x.id===el.dataset.shot);sh.method=el.value;render();},
  'fmt-gate':(el)=>{fmtTouch();const g=S.format.gates.find(x=>x.id===el.dataset.g);g.on=el.checked;render();},
  'fmt-acct':(el)=>{fmtTouch();S.format.accounts[el.dataset.a]=el.checked;render();},
  'fb-board':(el)=>{S.ui.fbBoard=el.value;},
  'disclose':(el)=>{const c=S.cands.find(x=>x.id===S.candSel);c.disclose=el.checked;render();}
};
function fmtTouch(){if(!S.fmtDraft)S.fmtDraft=JSON.stringify({lenMin:S.format.lenMin,lenMax:S.format.lenMax,decal:S.format.decal,shots:S.format.shots,gates:S.format.gates,accounts:S.format.accounts});S.fmtDirty=true;}
const IN={
  'draft-brief':(el)=>{S.ui.draftBrief=el.value;},
  'ns-title':(el)=>{S.ui.nsTitle=el.value;},
  'line-text':(el)=>{const b=curBoard();const l=b.lines[+el.dataset.i];l.text=el.value;l.meas=false;l.dur=estDur(el.value);refreshBoard();},
  'line-gap':(el)=>{const b=curBoard();const v=parseFloat(el.value);if(!isNaN(v)&&v>=0){b.lines[+el.dataset.i].gap=v;refreshBoard();}},
  'b-lead':(el)=>{const b=curBoard();const v=parseFloat(el.value);if(!isNaN(v)&&v>=0){b.lead=v;refreshBoard();}},
  'b-tail':(el)=>{const b=curBoard();const v=parseFloat(el.value);if(!isNaN(v)&&v>=0){b.tail=v;refreshBoard();}},
  'b-fixed':(el)=>{const b=curBoard();const v=parseFloat(el.value);if(!isNaN(v)&&v>0){b.fixed=v;refreshBoard();}},
  'b-title':(el)=>{const b=curBoard();b.title=el.value;const h=$('#h1');if(h)h.textContent=el.value||'Untitled board';},
  'ph-prompt':(el)=>{curBoard().prompt=el.value;},
  'ph-seed':(el)=>{const v=parseInt(el.value,10);curBoard().seedNext=isNaN(v)?null:v;},
  'cue-at':(el)=>{const b=curBoard();const v=parseFloat(el.value);if(!isNaN(v)&&v>=0){b.cues[+el.dataset.i].at=v;refreshBoard();}},
  'note-text':(el)=>{S.ui.noteText=el.value;},
  'fb-text':(el)=>{S.ui.fbText=el.value;},
  'lib-q':(el)=>{S.lib.q=el.value;const l=$('#lib-list');if(l)l.innerHTML=libCards();},
  'fmt-lenmin':(el)=>{const v=parseFloat(el.value);if(!isNaN(v)){fmtTouch();S.format.lenMin=v;showSave();}},
  'fmt-lenmax':(el)=>{const v=parseFloat(el.value);if(!isNaN(v)){fmtTouch();S.format.lenMax=v;showSave();}},
  'fmt-decal':(el)=>{const v=parseFloat(el.value);if(!isNaN(v)){fmtTouch();S.format.decal=v;showSave();}}
};
function showSave(){if(!$('#savebar')){const m=$('#main');const div=document.createElement('div');div.innerHTML='<div class="savebar" id="savebar"><span>Unsaved changes to the recipe.</span><div class="row"><button class="btn btn-sm btn-primary" id="fmt-save" data-act="fmt-save">Save as v'+(S.format.ver+1)+'</button><button class="btn btn-sm" id="fmt-discard" data-act="fmt-discard">Discard</button></div></div>';const sec=m.querySelector('.screen');if(sec)sec.appendChild(div.firstChild);}}
/* text edits commit on change: mark the board edited without a full re-render */
const COMMIT=new Set(['line-text','line-gap','b-lead','b-tail','b-fixed','cue-at']);

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const f=A[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('keydown',e=>{
  const el=e.target.closest&&e.target.closest('#scrub');if(!el)return;
  const c=S.cands.find(x=>x.id===S.candSel);if(!c)return;
  if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();S.ui.play.pos=clamp(S.ui.play.pos+(e.key==='ArrowRight'?1:-1),0,c.len);const st=candStory(c);if(st){const b=boardAt(st,S.ui.play.pos);if(b)S.ui.fbBoard=b.id;}render();}
});
document.addEventListener('input',e=>{const el=e.target;const k=el.dataset&&el.dataset.in;if(k&&IN[k])IN[k](el);});
document.addEventListener('change',e=>{const el=e.target;const d=el.dataset||{};
  if(d.ch&&CH[d.ch]){CH[d.ch](el);return;}
  if(d.in&&COMMIT.has(d.in)&&S.route==='board'){const b=curBoard();if(b&&b.status==='approved'){markEdited(b);refreshBoard();}}
});
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='revs')S.ui.revOpen=e.target.open;},true);

/* drag and drop reorder (desktop); arrow buttons cover touch and keyboard */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.board[draggable="true"]');if(!c)return;dragId=c.dataset.board;c.classList.add('dragging');try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId);}catch(_){}});
document.addEventListener('dragover',e=>{if(!dragId)return;const c=e.target.closest&&e.target.closest('.board');if(!c)return;e.preventDefault();document.querySelectorAll('.drop-target').forEach(x=>{if(x!==c)x.classList.remove('drop-target');});if(c.dataset.board!==dragId)c.classList.add('drop-target');});
document.addEventListener('drop',e=>{if(!dragId)return;const c=e.target.closest&&e.target.closest('.board');if(!c)return;e.preventDefault();const st=curStory();const from=bIndex(st,dragId);const to=bIndex(st,c.dataset.board);
  if(from>=0&&to>=0&&from!==to){const [b]=st.boards.splice(from,1);st.boards.splice(to,0,b);dragId=null;render();toast('Moved '+b.title+' to position '+(to+1)+'.');}});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.dragging,.drop-target').forEach(x=>x.classList.remove('dragging','drop-target'));});

window.addEventListener('hashchange',go);
go();
})();
</script>
