<title>Haynes Studio Storyboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<style>
:root {
  color-scheme: light;
  --page:#f3f6f8; --surface:#ffffff; --soft:#eaf0f4; --ink:#223442;
  --muted:#546775; --line:#ccd6de; --strong-line:#94a7b6;
  --accent:#255bab; --accent-soft:#e6eefc; --on-accent:#ffffff;
  --good:#246650; --good-soft:#e7f2ed; --review:#8a570c; --review-soft:#fbf1da;
  --danger:#a3313d; --focus:#145fb6; --clear:transparent; --shadow:#1834481a;
  --sky:#dce6eb; --ridge:#b3c6cc; --tree:#567578; --tree-dark:#36565d;
  --ground:#a7bab3; --frost:#edf3ef; --log:#6a7863; --fire:#d89240;
  --jacket:#315caf; --jacket-dark:#23457e; --stripe:#e2ebee; --letter:#f3d25d;
  --skin-a:#e6c3a5; --skin-b:#946c54; --skin-c:#c59771; --skin-d:#e4b9ad;
  --hair-a:#b7ad84; --hair-b:#363b42; --hair-c:#995b41; --hair-d:#e5d6ad;
  --face:#283b46; --bow:#b76480;
  --sans:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page:#192730; --surface:#21323d; --soft:#2a3e49; --ink:#e5edf3;
    --muted:#b0c0cc; --line:#3e5462; --strong-line:#6c8494;
    --accent:#94baff; --accent-soft:#304a6d; --on-accent:#172a48;
    --good:#9ad4b7; --good-soft:#28493e; --review:#ecc37d; --review-soft:#4c402d;
    --danger:#ffacb4; --focus:#adcaff; --clear:transparent; --shadow:#08141d44;
    --sky:#dce6eb; --ridge:#b3c6cc; --tree:#567578; --tree-dark:#36565d;
    --ground:#a7bab3; --frost:#edf3ef; --log:#6a7863; --fire:#d89240;
    --jacket:#315caf; --jacket-dark:#23457e; --stripe:#e2ebee; --letter:#f3d25d;
    --skin-a:#e6c3a5; --skin-b:#946c54; --skin-c:#c59771; --skin-d:#e4b9ad;
    --hair-a:#b7ad84; --hair-b:#363b42; --hair-c:#995b41; --hair-d:#e5d6ad;
    --face:#283b46; --bow:#b76480;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:#192730; --surface:#21323d; --soft:#2a3e49; --ink:#e5edf3;
  --muted:#b0c0cc; --line:#3e5462; --strong-line:#6c8494;
  --accent:#94baff; --accent-soft:#304a6d; --on-accent:#172a48;
  --good:#9ad4b7; --good-soft:#28493e; --review:#ecc37d; --review-soft:#4c402d;
  --danger:#ffacb4; --focus:#adcaff; --clear:transparent; --shadow:#08141d44;
  --sky:#dce6eb; --ridge:#b3c6cc; --tree:#567578; --tree-dark:#36565d;
  --ground:#a7bab3; --frost:#edf3ef; --log:#6a7863; --fire:#d89240;
  --jacket:#315caf; --jacket-dark:#23457e; --stripe:#e2ebee; --letter:#f3d25d;
  --skin-a:#e6c3a5; --skin-b:#946c54; --skin-c:#c59771; --skin-d:#e4b9ad;
  --hair-a:#b7ad84; --hair-b:#363b42; --hair-c:#995b41; --hair-d:#e5d6ad;
  --face:#283b46; --bow:#b76480;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-underline-offset:4px}
button,a,input,select,textarea,summary{-webkit-tap-highlight-color:var(--clear)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3,p,figure{margin:0}
h1{font-size:clamp(1.65rem,4vw,2.25rem);line-height:1.14;letter-spacing:-.04em;font-weight:650;overflow-wrap:anywhere}
h1[tabindex="-1"]:focus{outline:none}
h2{font-size:1.1rem;line-height:1.3;letter-spacing:-.02em}
h3{font-size:1rem}
ul,ol{padding:0;margin:0;list-style:none}
button{cursor:pointer}
button:disabled{opacity:.48;cursor:not-allowed}
button,a{touch-action:manipulation}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.shell{max-width:1184px;margin:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.top{display:flex;align-items:center;gap:18px;min-height:60px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--page);border-bottom:1px solid var(--line)}
.topline{display:contents}
.brand-name{display:none}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-size:.8rem;letter-spacing:.13em;font-weight:750;white-space:nowrap;min-width:0}
.brand-mark{width:22px;height:22px;border:2px solid var(--ink);display:grid;place-items:center;font:700 14px var(--mono);letter-spacing:0}
.topnav{display:flex;gap:20px;min-width:0;flex:1;order:1}
.topnav a,.subnav a{display:flex;align-items:center;min-height:44px;text-decoration:none;border-bottom:3px solid var(--clear);font-weight:600;color:var(--muted)}
.topnav a{min-height:60px}
.topnav a[aria-current],.subnav a[aria-current]{color:var(--accent);border-color:var(--accent)}
.user{position:relative;min-width:0;order:2}
.user>button{display:flex;align-items:center;gap:8px;border:0;background:var(--clear);min-height:44px;padding:4px 0 4px 10px;font-size:.85rem}
.avatar{display:none;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--soft);font:12px var(--mono);color:var(--muted)}
.menu{position:absolute;right:0;top:48px;width:244px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px var(--shadow);padding:16px;z-index:30}
.menu a{display:flex;align-items:center;min-height:44px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line);margin-top:10px}
.menu legend{font-size:.75rem;color:var(--muted);margin-bottom:8px}
.theme-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.theme-options button{border:1px solid var(--line);background:var(--surface);border-radius:3px;min-height:44px;font-size:.8rem;padding:4px}
.theme-options button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;min-height:52px;color:var(--muted);font-size:.75rem;position:relative}
.crumbs a{color:var(--muted);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.crumbs .crumb-tail{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.crumb-wide{display:none}
.ancestor{position:relative;flex:none}
.ancestor>summary{cursor:pointer;display:grid;place-items:center;list-style:none;width:40px;height:40px;background:var(--soft);font-family:var(--mono);border-radius:3px}
.ancestor>summary::-webkit-details-marker{display:none}
.ancestor-list{position:absolute;left:0;top:46px;z-index:15;min-width:220px;background:var(--surface);border:1px solid var(--line);padding:8px 16px;box-shadow:0 8px 24px var(--shadow)}
.ancestor-list a{display:flex}
.context{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-block:4px 14px}
.example{font:10px var(--mono);color:var(--muted);border:1px solid var(--line);padding:3px 6px;white-space:nowrap}
.eyebrow{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.subnav{display:flex;gap:24px;min-width:0;border-bottom:1px solid var(--line);margin-bottom:22px}
.subnav a{min-width:52px}
main{min-width:0}
.page-head{display:flex;flex-direction:column;gap:12px;margin-bottom:24px;min-width:0}
.page-head .meta{margin-top:4px}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;min-width:0}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack-tight{display:flex;flex-direction:column;gap:8px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:.8rem;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:44px;padding:9px 15px;background:var(--surface);border:1px solid var(--strong-line);border-radius:3px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.85rem;line-height:1.3;text-align:center}
.btn:hover:not(:disabled){background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--on-accent)}
.btn.quiet{border-color:var(--clear);background:var(--clear);color:var(--muted)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.icon{width:44px;padding:8px;font:18px var(--mono);flex:none}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.73rem;font-weight:600;color:var(--muted);width:fit-content}
.status::before{content:"";width:6px;height:6px;background:var(--muted);border-radius:50%;flex:none}
.status.good{color:var(--good)}.status.good::before{background:var(--good)}
.status.review{color:var(--review)}.status.review::before{background:var(--review)}
.status.working{color:var(--accent)}.status.working::before{background:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);padding:18px;min-width:0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-block:28px 12px;min-width:0}
.section-head>div{min-width:0}
.tree-list{border-top:1px solid var(--line)}
.tree-link{display:flex;align-items:center;gap:18px;padding-block:20px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);min-width:0}
.tree-link>div{min-width:0;flex:1}
.tree-link h2{margin-bottom:6px}
.tree-link .arrow{color:var(--muted);font-size:22px}
.tree-link:hover h2{color:var(--accent)}
.team-mark{display:grid;place-items:center;flex:none;width:64px;height:76px;background:var(--jacket);color:var(--letter);font:700 25px var(--mono);border-bottom:5px solid var(--letter)}
.folder-mark{width:40px;height:32px;border:1px solid var(--strong-line);border-top:5px solid var(--strong-line);background:var(--soft);flex:none}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.filter{min-height:44px;padding:8px 10px;border:1px solid var(--line);background:var(--clear);border-radius:3px;font-size:.77rem}
.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.empty{padding:36px 18px;text-align:center;border:1px dashed var(--strong-line);color:var(--muted)}
.hero{display:grid;grid-template-columns:112px minmax(0,1fr);gap:20px;align-items:start}
.hero-info{padding-block:6px;display:flex;flex-direction:column;gap:16px;min-width:0}
.hero-info strong{font-size:1.1rem;font-weight:600;line-height:1.3}
.hero-info .btn{align-self:start}
.art{aspect-ratio:9/16;background:var(--sky);overflow:hidden;position:relative;min-width:0}
.art svg{width:100%;height:100%;display:block}
.art.square{aspect-ratio:1}
.photo-label{position:absolute;bottom:8px;left:8px;font:10px var(--mono);background:var(--surface);color:var(--ink);padding:3px 6px}
.art .sky{fill:var(--sky)}.art .ridge{fill:var(--ridge)}.art .tree{fill:var(--tree)}
.art .tree-dark{fill:var(--tree-dark)}.art .ground{fill:var(--ground)}.art .frost{fill:var(--frost)}
.art .log{fill:var(--log)}.art .fire{fill:var(--fire)}.art .jacket{fill:var(--jacket)}
.art .jacket-dark{fill:var(--jacket-dark)}.art .stripe{fill:var(--stripe)}.art .letter{fill:var(--letter)}
.art .skin-a{fill:var(--skin-a)}.art .skin-b{fill:var(--skin-b)}.art .skin-c{fill:var(--skin-c)}.art .skin-d{fill:var(--skin-d)}
.art .hair-a{fill:var(--hair-a)}.art .hair-b{fill:var(--hair-b)}.art .hair-c{fill:var(--hair-c)}.art .hair-d{fill:var(--hair-d)}
.art .face{fill:var(--face)}.art .bow{fill:var(--bow)}.art .contour{fill:none;stroke:var(--face);stroke-width:1.5;stroke-linecap:round}
.art .seam{fill:none;stroke:var(--jacket-dark);stroke-width:1.5}
.art .fine{fill:none;stroke:var(--stripe);stroke-width:2}
.build-box{margin-block:22px;border-top:2px solid var(--ink);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.build-box .row>div{min-width:0}
progress{display:block;width:100%;height:7px;appearance:none;border:0;background:var(--soft);accent-color:var(--accent)}
progress::-webkit-progress-bar{background:var(--soft)}progress::-webkit-progress-value{background:var(--accent)}progress::-moz-progress-bar{background:var(--accent)}
.board-list{border-top:1px solid var(--line)}
.board-item{display:grid;grid-template-columns:66px minmax(0,1fr);gap:12px;padding-block:16px;border-bottom:1px solid var(--line);min-width:0}
.board-item>div{min-width:0}
.board-item .art{width:66px}
.board-copy{display:flex;flex-direction:column;gap:8px;min-width:0}
.board-title{display:flex;align-items:baseline;gap:9px;min-width:0}
.board-title a{font-weight:650;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.board-title a:hover{text-decoration:underline}
.board-number{font:12px var(--mono);color:var(--muted);flex:none}
.script-read{display:flex;flex-direction:column;gap:5px;font-size:.85rem}
.script-read li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;min-width:0;overflow-wrap:anywhere}
.script-read .speaker{font:11px var(--mono);padding-top:3px;color:var(--muted)}
.board-tools{grid-column:2;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.board-tools .row{gap:4px}
.board-tools .btn{font-size:.8rem}
.board-pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px}
.board-pager>a{font-size:.8rem;min-height:44px;display:flex;align-items:center}
.edit-layout{display:grid;gap:24px;min-width:0}
.reference{display:grid;grid-template-columns:144px minmax(0,1fr);gap:18px;align-items:start;min-width:0}
.reference figcaption{font-size:.7rem;color:var(--muted);margin-top:6px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field-label{font-size:.75rem;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--strong-line);border-radius:3px;min-height:44px;padding:9px 10px;width:100%;min-width:0;max-width:100%}
textarea{resize:vertical;line-height:1.5}
input[type="number"]{font-family:var(--mono)}
.input-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.composer{border-top:1px solid var(--line);margin-top:20px;min-width:0}
.composer summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;font-size:.8rem;font-weight:600;color:var(--accent);cursor:pointer;list-style:none}
.composer summary::-webkit-details-marker{display:none}
.composer summary::after{content:"+";font-family:var(--mono)}
.composer[open] summary::after{content:"−"}
.composer .stack{padding-block:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:3px;min-height:44px;padding:7px 9px;font-size:.75rem;max-width:100%;overflow-wrap:anywhere}
.chip span{min-width:0}.chip b{font-size:16px;font-weight:400;flex:none}
.prompt-result{font-size:.75rem;color:var(--muted);padding:10px;border-left:2px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap}
.script-fields{display:flex;flex-direction:column;gap:16px}
.line-fields{display:grid;grid-template-columns:68px minmax(0,1fr);gap:10px;min-width:0}
.line-fields .line-action{grid-column:2;justify-self:end;min-height:32px;padding:4px 8px;font-size:.75rem}
.approval-bar{border-top:1px solid var(--line);padding-top:16px;margin-top:22px;display:flex;flex-direction:column;align-items:start;gap:10px}
.confirmation{grid-column:1/-1;padding:14px;border:1px solid var(--danger);background:var(--surface)}
.asset-controls{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;margin-bottom:16px}
.asset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
.asset-card{min-width:0;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);padding-bottom:16px}
.asset-card .art{aspect-ratio:4/3}
.asset-card h3{font-size:.85rem;overflow-wrap:anywhere}
.asset-card .btn{margin-top:auto}
.target-board{padding:12px;background:var(--soft);margin-bottom:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.target-board select{font-size:.8rem}
.generate-layout{display:grid;gap:24px;min-width:0}
.generate-preview{max-width:280px;width:100%;margin:auto}
.result-panel{border-top:2px solid var(--accent);padding-top:16px;margin-top:18px}
.notice{position:fixed;bottom:max(16px,env(safe-area-inset-bottom,0px));left:16px;right:16px;z-index:40;background:var(--ink);color:var(--surface);border:1px solid var(--strong-line);padding:12px 16px;max-width:540px;margin:auto;font-size:.82rem;box-shadow:0 4px 18px var(--shadow)}
.preview-strip{display:flex;flex-wrap:wrap;gap:6px}
.preview-strip button{min-width:44px;min-height:44px;background:var(--surface);border:1px solid var(--line);border-radius:3px;font:12px var(--mono)}
.preview-strip button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.cut-layout{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;margin-block:16px}
.cut-layout>div{min-width:0}
.media-folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.media-folders .tree-link{gap:12px}
.run-list{display:flex;flex-direction:column;gap:12px}
.run-item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.run-item .meta{gap:4px 12px;font-size:.73rem}
.run-select{padding:0;min-height:44px;border:0;background:var(--clear);font-weight:650;text-decoration:underline;text-underline-offset:4px;color:var(--accent)}
.run-select[aria-pressed="true"]{text-decoration-thickness:3px}
.compare-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-block:16px}
.compare-column{min-width:0;display:flex;flex-direction:column;gap:12px}
.compare-column strong{overflow-wrap:anywhere}
.compare-column .art{width:100%;max-width:180px}
.compare-column .empty{padding:24px 8px}
.compare-column .script-read{font-size:.8rem}
#cut-review{margin-top:24px;scroll-margin-top:84px}
.settings-row{display:flex;justify-content:space-between;gap:16px;padding-block:16px;border-bottom:1px solid var(--line);font-size:.85rem}
.settings-row>*{min-width:0}
@media(min-width:700px){
  .top{gap:36px;min-height:68px}.brand-name{display:inline}.avatar{display:grid}.topnav a{min-height:68px}
  .crumb-wide{display:contents}.ancestor{display:none}.crumbs{font-size:.8rem;gap:12px;min-height:60px}
  .page-head{flex-direction:row;align-items:center;justify-content:space-between;gap:24px}
  .hero{grid-template-columns:180px minmax(0,1fr);gap:28px}.hero-info{gap:22px;padding:16px 0}
  .hero-info strong{font-size:1.6rem}.hero{max-width:740px}
  .board-item{grid-template-columns:82px minmax(0,1fr) auto;gap:20px}.board-item .art{width:82px}
  .board-tools{grid-column:3;flex-direction:column;justify-content:start;align-items:end}
  .script-read{font-size:.9rem}.asset-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
  .asset-controls{max-width:700px}
  .target-board{flex-direction:row;align-items:center;gap:16px}.target-board select{width:auto;max-width:360px}
  .generate-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cut-layout{grid-template-columns:150px minmax(0,1fr)}
  .compare-grid{gap:24px}
}
@media(min-width:900px){
  .edit-layout{grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:48px}
  .reference{grid-template-columns:220px minmax(0,1fr);gap:20px}
  .story-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;align-items:start}
  .story-layout>.build-box{margin:0;position:sticky;top:96px}
}

<script>
(() => {

}
const boards = [
  board('b1','Day 340',6.38,['a'],[line('a',"Day three hundred forty. I've mastered fire, shelter, and emotionally supportive moss.")],
    'A, proud, facing right behind the mossy log. Moss held like a trophy. Campfire on the left.',{assets:['cast-a','jacket','campsite','moss']}),
  board('b2','The menu',3.92,['b'],[line('b',"Winter's coming. We need to discuss the menu.")],

  board('b3','Orange slices',6.08,['c'],[line('c','I nominate whoever brought orange slices. They know what they did.')],

  board('b6','Eat her',5.08,['c'],[line('c',"If we can't eat the squishies, why don't we just eat her?")],

  board('b7','Reaction close-up',1.9,['d'],[],

  board('b8','The vote',10.46,['a','c','b','d'],[

const state = {route:'media-winter-menu',selected:'b7',runs:[],activeRun:null,compare:null,preview:0,remove:null,

const total = () => boards.reduce((sum,b)=>sum+b.duration,0);

const editorRoute = route => route.startsWith('editor-')||route.startsWith('board-')||route==='asset-generate';

const badge = (text,kind='') => `<span class="status ${kind}">${esc(text)}</span>`;
const head = (title,meta='',action='') => `<div class="page-head"><div><h1 id="page-title" tabindex="-1">${esc(title)}</h1>${meta?`<div class="meta">${meta}</div>`:''}</div>${action}</div>`;
const button = (text,action,cls='',extra='') => {

const link = (text,route,cls='') => `<a class="btn ${cls}" href="#${route}">${text}</a>`;
function boardStatus(b) { return b.photoBusy?badge('Making photo…','working'):b.agent?badge('Agent draft'):''; }
function canBuild() { return boards.length>0; }
function estimate(duration=total()) {
  if(Math.abs(duration-45.28)<.05) return '~1.5–2 h';
  return `~${Math.max(1,Math.round(duration*90/45))}–${Math.max(2,Math.round(duration*120/45))} min`;
}
// Geometric placeholders only. These are not generated media or likenesses.

  return `<g transform="translate(${x} ${y}) scale(${scale})">

    <text class="stripe" x="-13" y="73" font-size="8" font-family="monospace">${d.toUpperCase()}</text>
    ${d==='d'?'<path class="bow" d="M13-32L4-40V-25L13-32L22-40V-25Z"/>':''}
  </g>`;
}
function scene(input={assets:[]},version=1,kind='scene') {
  const ids=input.assets||[];
  const cast=ids.map(assetById).filter(a=>a?.kind==='cast').map(a=>a.doll||'a');
  const close=/close-up/i.test(input.prompt||'');
  const shifted=version%2===0?5:0;
  let figures='';
  if(kind==='costume') figures=`<g transform="translate(90 125) scale(1.8)"><path class="jacket" d="M-8-15L-30-5L-40 70L-24 75L-18 26L-18 85L18 85L18 26L24 75L40 70L30-5L8-15Z"/><path class="fine" d="M-29 2L-34 65M29 2L34 65"/><path class="seam" d="M0-5V85"/><text class="letter" y="23" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" font-weight="700">YELLOWBIRDS</text></g>`;
  else if(kind==='prop') figures=ids.includes('moss')?'<path class="log" d="M36 207Q15 164 55 156Q65 131 93 151Q123 131 143 162Q169 181 143 210Z"/>':ids.includes('squishy')?'<g transform="translate(44 147)"><rect class="letter" width="92" height="62" rx="12"/><path class="bow" d="M25 18L28 24L36 25L29 30L30 38L24 33L17 37L18 29L12 24L21 23Z"/><circle class="jacket" cx="66" cy="37" r="4"/></g>':'<g transform="translate(48 150)"><path class="jacket" d="M72 8H91Q110 8 110 30Q110 52 88 52H72V43H87Q100 43 100 30Q100 17 87 17H72Z"/><path class="stripe" d="M0 0H78V58Q78 70 64 70H14Q0 70 0 58Z"/><rect class="jacket" width="78" height="8"/></g>';
  else if(cast.length===1) figures=doll(cast[0],90+shifted,close?148:178,close?2.6:1.65,/shocked/i.test(input.prompt||''));
  else if(cast.length>1) figures=cast.map((d,i)=>doll(d,27+i*(126/Math.max(cast.length-1,1)),169+(i%2)*22,.8,d==='d')).join('');
  const camp=ids.includes('campsite')||kind==='scene'||kind==='set';
  return `<svg viewBox="0 0 180 320" aria-hidden="true"><rect class="sky" width="180" height="320"/>
    <path class="ridge" d="M0 110L40 75L90 111L140 64L180 100V280H0Z"/>
    ${camp?'<path class="tree" d="M24 13L-8 129H12L-9 195H60L40 129H57ZM142 0L111 120H126L107 184H179L157 120H173Z"/><path class="tree-dark" d="M-8 41L-30 179H-18L-36 244H25L11 179H27ZM184 60L158 203H171L156 257H208L193 203H207Z"/><path class="ground" d="M0 226Q85 205 180 228V320H0Z"/><path class="frost" d="M0 251L65 242L57 248L147 241L180 253V320H0Z"/>':''}
    <g transform="translate(${shifted} 0)">${figures}</g>
    ${camp&&!close?'<path class="log" d="M-5 278Q50 265 185 282V320H-5Z"/><path class="ground" d="M0 280L78 280L69 284L125 286L139 292L0 290Z"/><path class="fire" d="M14 267Q6 255 17 239Q14 251 23 253Q27 241 25 237Q41 260 27 270Z"/>':''}
  </svg>`;
}
function photo(b,cls='',label=false) {
  const input=b.photoInput||{assets:[],prompt:''};
  return `<div class="art ${cls}" role="img" aria-label="${esc(b.photo?'Illustrated reference: '+b.title:'Reference photo not generated')}">${b.photo?scene(input,b.photo):scene({assets:['campsite']},1,'set')}${label?`<span class="photo-label">${b.photo?'v'+b.photo:'No photo'}</span>`:''}</div>`;
}
function assetArt(a) {
  const ids=a.kind==='cast'?['cast-'+(a.doll||'a')]:[a.id];
  return `<div class="art" role="img" aria-label="${esc(a.name)} placeholder">${scene({assets:ids},a.variant||1,a.kind)}</div>`;
}
function readLines(b) {
  return b.lines.length?`<ul class="script-read">${b.lines.map(l=>`<li><span class="speaker">${esc(l.speaker.toUpperCase())}</span><span>${esc(l.text)}</span></li>`).join('')}</ul>`:'<p class="small muted">No dialogue</p>';
}
function productionsView() {
  return head('Productions','<span>1 production</span>')+`<div class="tree-list"><a class="tree-link" href="#prod-yellowbirds"><span class="team-mark" aria-hidden="true">YB</span><div><h2>Yellowbirds</h2><p class="meta">1 short · 0 videos</p></div><span class="arrow" aria-hidden="true">→</span></a></div>`;
}
function productionView() {
  return head('Yellowbirds','<span>Production</span>',link('Open editor',state.lastBoard))+
    `<div class="media-folders">${[['Shorts','shorts-yellowbirds','1 short'],['Videos','videos-yellowbirds','0 videos']].map(([name,route,count])=>`<a class="tree-link" href="#${route}"><span class="folder-mark" aria-hidden="true"></span><div><h2>${name}</h2><span class="meta">${count}</span></div><span class="arrow" aria-hidden="true">→</span></a>`).join('')}</div>`+
    '<div class="section-head"><h2>Media</h2></div>'+mediaList('production');
}
function mediaList(key) {
  const filter=state.mediaFilters[key],videos=key==='videos';
  // Publication and go-live approval are independent. This private example is unpublished.
  const matches=!videos&&filter.publication!=='published'&&(!filter.approved||mediaApproved());
  const filters=[['unpublished','Unpublished'],['published','Published'],['approved','Approved']];
  return `<div class="filters" role="group" aria-label="Media status">${filters.map(([value,label])=>`<button class="filter" id="filter-${value}" data-action="media-filter" data-list="${key}" data-value="${value}" aria-pressed="${value==='approved'?filter.approved:filter.publication===value}" ${value==='approved'?'aria-label="Approved for go-live"':''}>${label}</button>`).join('')}</div>`+
    (matches?`<div class="tree-list"><a class="tree-link" href="#media-winter-menu"><div style="flex:0 0 62px">${photo(boards[0]||{title:'Empty story',photo:0})}</div><div><h2>The Winter Menu</h2><p class="meta">${seconds(total())} · Short</p><div class="row">${badge('Unpublished')}${mediaApproved()?badge('Approved for go-live','good'):''}</div></div><span class="arrow" aria-hidden="true">→</span></a></div>`:
      `<div class="empty">${videos?'No videos yet.':'No matching media.'}</div>`);
}
function mediaListView(videos=false) {
  return head(videos?'Videos':'Shorts','<span>Yellowbirds</span>')+mediaList(videos?'videos':'shorts');
}
function runTime(run) {
  return `<time datetime="${run.created}" title="Queued at ${esc(new Date(run.created).toLocaleString())}">${esc(new Date(run.created).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}))}</time>`;
}
function buildPanel() {
  const done=finishedRuns();
  return `<section class="build-box" id="build-panel" aria-label="Video runs">
    <div class="row between"><div class="stack-tight"><h2>Runs</h2><span class="small muted">${boards.length?esc(estimate())+' · simulated':'Add a board to start.'}</span></div>${button(isRunning()?'Queue run':'Build','build-start','primary',`id="build-button" ${canBuild()?'':'disabled'}`)}</div>
    ${state.runs.length?`<ol class="run-list">${state.runs.map(run=>`<li class="run-item" id="run-${run.number}">
      <div class="row between">${run.status==='done'?`<button class="run-select" id="view-run-${run.number}" data-action="run-view" data-number="${run.number}" aria-label="View run ${pad(run.number)}" aria-pressed="${!state.compare&&state.activeRun===run.number}">Run ${pad(run.number)}</button>`:`<strong class="small">Run ${pad(run.number)}</strong>`}${badge(run.status==='done'?'Done':run.status==='running'?'Running':'Queued',run.status==='done'?'good':run.status==='running'?'working':'')}</div>
      <div class="meta"><span id="run-detail-${run.number}">${run.status==='done'?'100%':(run.status==='running'?run.progress+'% · ':'')+esc(run.estimate)}</span>${runTime(run)}</div>
      ${run.status==='running'?`<progress id="run-progress-${run.number}" value="${run.progress}" max="100" aria-label="Run ${pad(run.number)} simulated progress"></progress>`:''}
      ${run.approved?badge('Approved for go-live','good'):''}
    </li>`).join('')}</ol>`:''}
    ${done.length>=2?button('Compare runs','compare-start','quiet'):''}
  </section>`;
}
function previewPicker(items,active,comparing=false) {
  return `<div class="preview-strip" role="group" aria-label="${comparing?'Compare':'Preview'} board">${items.map((b,i)=>`<button id="preview-board-${i}" data-action="preview-board" data-index="${i}" aria-label="${comparing?'Compare':'Preview'} board ${i+1}: ${esc(b.title)}" aria-pressed="${active===i}">${pad(i+1)}</button>`).join('')}</div>`;
}
function comparisonBoards(left,right) {
  // Match stable board IDs, so additions, removals and reordering stay comparable.
  return [...left.boards,...right.boards.filter(b=>!left.boards.some(x=>x.id===b.id))];
}
function compareReview() {
  const left=finishedRuns().find(run=>run.number===state.compare.left);
  const right=finishedRuns().find(run=>run.number===state.compare.right);
  if(!left||!right) return '';
  const items=comparisonBoards(left,right);
  state.compare.preview=Math.min(state.compare.preview,items.length-1);
  const id=items[state.compare.preview].id;
  return `<section class="panel" id="cut-review"><div class="row between"><h2>Compare runs</h2>${button('Close','compare-close','quiet','aria-label="Close comparison"')}</div><p class="small muted">Storyboard previews</p>
    <div class="compare-grid">${[['left',left,right],['right',right,left]].map(([side,run,other])=>{
      const b=run.boards.find(board=>board.id===id);
      return `<div class="compare-column"><div class="field"><label for="compare-${side}">${side==='left'?'Left':'Right'} run</label><select id="compare-${side}">${finishedRuns().map(r=>`<option value="${r.number}" ${r.number===run.number?'selected':''} ${r.number===other.number?'disabled':''}>Run ${pad(r.number)} · ${seconds(r.duration)}</option>`).join('')}</select></div>
        ${b?`${photo(b)}<strong class="small">${pad(run.boards.indexOf(b)+1)} · ${esc(b.title)}</strong><span class="small muted">${methods[b.method]} · ${seconds(b.duration)}</span>${readLines(b)}${b.cue?`<span class="small muted">${esc(b.cue)}</span>`:''}`:'<div class="empty small">Not in this run</div>'}
        ${button('View run '+pad(run.number),'run-view','quiet',`data-number="${run.number}" id="compare-view-${run.number}"`)}
      </div>`;
    }).join('')}</div>${previewPicker(items,state.compare.preview,true)}</section>`;
}
function cutReview() {
  if(state.compare) return compareReview();
  const run=currentRun();
  if(!run) return '';
  state.preview=Math.min(state.preview,run.boards.length-1);
  const b=run.boards[state.preview];
  return `<section class="panel" id="cut-review"><div class="row between"><h2>Run ${pad(run.number)}</h2>${badge(run.approved?'Approved for go-live':'Done','good')}</div>
    <div class="meta"><span>${seconds(run.duration)}</span><span>Storyboard preview</span></div>
    <div class="cut-layout">${photo(b)}<div class="stack-tight"><strong>${pad(state.preview+1)} · ${esc(b.title)}</strong><span class="small muted">${methods[b.method]} · ${seconds(b.duration)}</span>${readLines(b)}${b.cue?`<span class="small muted">${esc(b.cue)}</span>`:''}</div></div>
    ${previewPicker(run.boards,state.preview)}
    <div class="approval-bar">${run.approved?'<div class="row"><button class="btn" disabled aria-describedby="publish-status">Publish</button><span class="small muted" id="publish-status">Not connected</span></div>':button('Approve for go-live','cut-approve','primary')}</div></section>`;
}
function boardList(editing=false) {
  if(!boards.length) return '<div class="empty">No boards yet.</div>';
  return `<ol class="board-list" aria-label="Story boards">${boards.map((b,i)=>`<li class="board-item" id="row-${b.id}"><a href="#board-${b.id}" aria-label="Open board ${i+1}: ${esc(b.title)}">${photo(b)}</a><div class="board-copy"><div class="board-title"><span class="board-number">${pad(i+1)}</span><a href="#board-${b.id}">${esc(b.title||'Untitled board')}</a></div><div class="meta"><span>${methods[b.method]}</span><span>${seconds(b.duration)}</span></div>${readLines(b)}${b.cue?`<span class="small muted">${esc(b.cue)}</span>`:''}${boardStatus(b)}</div>
      ${editing?`<div class="board-tools"><div class="row">${button('↑','move','icon',`id="up-${b.id}" data-id="${b.id}" data-direction="-1" aria-label="Move board ${i+1} up" ${i===0?'disabled':''}`)}${button('↓','move','icon',`id="down-${b.id}" data-id="${b.id}" data-direction="1" aria-label="Move board ${i+1} down" ${i===boards.length-1?'disabled':''}`)}</div>${button('Remove','remove-ask','quiet',`data-id="${b.id}" aria-label="Remove board ${i+1}"`)}</div>`:''}
      ${state.remove===b.id?`<div class="confirmation stack-tight"><strong>Remove “${esc(b.title)}”?</strong><div class="row">${button('Remove board','remove-confirm','danger',`data-id="${b.id}"`)}${button('Keep board','remove-cancel','quiet')}</div></div>`:''}</li>`).join('')}</ol>`;
}
function storyView(editing=false) {

      b.photoDirty=JSON.stringify(input)!==JSON.stringify({assets:b.assets,prompt:b.prompt});
      if(state.route==='board-'+b.id) render();
      else if((state.route==='editor-assets'&&selected()?.id===b.id)||['editor-board','media-winter-menu'].includes(state.route)) render();
      notify('Reference photo updated · simulated.');
    },1500);return;
  }
  if(action==='build-start') {startBuild();return;}
  if(action==='run-view') {viewRun(Number(el.dataset.number));return;}
  if(action==='preview-board') {
    if(state.compare) state.compare.preview=Number(el.dataset.index);
    else state.preview=Number(el.dataset.index);
    render();return;
  }
  if(action==='compare-start') {
    const done=finishedRuns();if(done.length<2)return;
    state.compare={left:done.at(-2).number,right:done.at(-1).number,preview:0};render();
    $('#cut-review')?.scrollIntoView({block:'start'});return;
  }
  if(action==='compare-close') {state.compare=null;render('action-compare-start');return;}
  if(action==='cut-approve') {
    const run=currentRun();if(!run||run.approved)return;
    run.approved=true;render();notify(`Run ${pad(run.number)} approved for go-live · example only.`);return;
  }
  if(action==='asset-generate') {
    const g=state.gen;if(g.busy||!g.name.trim()||!g.prompt.trim())return;
    g.busy=true;const input={name:g.name.trim(),kind:g.kind,prompt:g.prompt,variant:(g.result?.variant||0)+1};render();
    setTimeout(()=>{g.result={...input,promoted:false};g.busy=false;if(state.route==='asset-generate')render('asset-generate-button');notify('Asset generated · simulated. Review it before promoting.');},1500);return;
  }
  if(action==='asset-promote') {
    const g=state.gen,r=g.result;if(!r||r.promoted||g.busy)return;
    assets.push({id:'asset-'+(++sequence),name:r.name,kind:r.kind,prompt:r.prompt,variant:r.variant,labels:[state.production],doll:r.kind==='cast'?'a':undefined});
    r.promoted=true;render();notify('Promoted to the Yellowbirds library.');
  }
});
document.addEventListener('input',event=>{
  const el=event.target,b=selected(),id=el.id;
  if(id==='asset-search') {
    state.search=el.value;
    const template=document.createElement('template');template.innerHTML=libraryView();
    $('#asset-results').innerHTML=template.content.querySelector('#asset-results').innerHTML;
    $('#asset-count').textContent=template.content.querySelector('#asset-count').textContent;
    saveSelections();return;
  }
  if(['asset-name','asset-prompt'].includes(id)) {
    const g=state.gen;if(g.busy)return;
    g[id==='asset-name'?'name':'prompt']=el.value;
    if(g.result) {g.result=null;$('.generate-preview').innerHTML='<div class="empty">Asset preview</div>';}
    $('#asset-generate-button').textContent='Generate asset';$('#asset-generate-button').disabled=!g.name.trim()||!g.prompt.trim();
    $('#asset-gen-status').textContent='Yellowbirds';return;
  }
  if(!b)return;
  if(id==='board-name') {b.title=el.value;$('#page-title').textContent=b.title||'Untitled board';}
  else if(id==='board-duration') {b.duration=Number.isFinite(Number(el.value))?Math.max(0,Number(el.value)):0;}
  else if(id==='photo-prompt'&&!b.photoBusy) {b.prompt=el.value;b.photoDirty=true;}
  else if(id.startsWith('text-line-')) {const l=b.lines.find(x=>x.id===el.dataset.line);if(l)l.text=el.value;}
  else return;
  refreshBoard();
});
document.addEventListener('change',event=>{
  const el=event.target,b=selected();
  if(el.id==='asset-kind') {state.assetKind=el.value;render(el.id);}
  else if(el.id==='asset-target') {state.selected=el.value;state.lastBoard='board-'+el.value;render(el.id);}
  else if(el.id==='new-asset-kind'&&!state.gen.busy) {state.gen.kind=el.value;state.gen.result=null;render(el.id);}
  else if(state.compare&&['compare-left','compare-right'].includes(el.id)) {
    const side=el.id.slice(8),number=Number(el.value),other=side==='left'?'right':'left';
    if(finishedRuns().some(run=>run.number===number)&&number!==state.compare[other]) {state.compare[side]=number;state.compare.preview=0;render(el.id);}
  }
  else if(b) {
    if(el.id==='board-method') {b.method=el.value;refreshBoard();}
    else if(el.id.startsWith('speaker-line-')) {const l=b.lines.find(x=>x.id===el.dataset.line);if(l){l.speaker=el.value;refreshBoard();}}
  }
});
document.addEventListener('toggle',event=>{
  const el=event.target;
  if(el.matches('details[data-panel]')&&el.isConnected) {
    state.panels[state.route+':'+el.id]=el.open;saveSelections();
  }
},true);
route();
})();
</script>
