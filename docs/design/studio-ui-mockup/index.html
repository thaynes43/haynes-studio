<meta charset="utf-8">
<title>Haynes Studio Storyboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  color-scheme: light;
  --page:#f3f4f3; --surface:#ffffff; --soft:#e8eae8; --ink:#141614;
  --muted:#5b605c; --line:#d8dbd8; --strong-line:#9ba09c;
  --accent:#13823d; --accent-soft:#e2f4e7; --on-accent:#ffffff;
  --good:#13823d; --good-soft:#e2f4e7; --review:#8a5d12; --review-soft:#f6ecd6;
  --danger:#b3263a; --focus:#13823d; --clear:transparent; --shadow:#0c0f0c1a;
  --stage:#0b0c0b; --stage-ink:#eef0ee; --stage-muted:#a7aba8; --stage-line:#353835;
  --wave:#4fcf7a;
  --sky:#dce6eb; --ridge:#b3c6cc; --tree:#567578; --tree-dark:#36565d;
  --ground:#a7bab3; --frost:#edf3ef; --log:#6a7863; --fire:#d89240;
  --jacket:#315caf; --jacket-dark:#23457e; --stripe:#e2ebee; --letter:#f3d25d;
  --skin-a:#e6c3a5; --skin-b:#946c54; --skin-c:#c59771; --skin-d:#e4b9ad;
  --hair-a:#b7ad84; --hair-b:#363b42; --hair-c:#995b41; --hair-d:#e5d6ad;
  --face:#283b46; --bow:#b76480;
  --sans:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
  --page:#0a0a0a; --surface:#1b1b1b; --soft:#2b2b2b; --ink:#f2f2f2;
  --muted:#a5a5a5; --line:#2f2f2f; --strong-line:#5a5a5a;
  --accent:#3ddc6f; --accent-soft:#163020; --on-accent:#04140a;
  --good:#3ddc6f; --good-soft:#163020; --review:#e8b85c; --review-soft:#3a2f18;
  --danger:#ff8a96; --focus:#6ee894; --clear:transparent; --shadow:#00000066;
  --stage:#000000; --stage-ink:#eeeeee; --stage-muted:#a5a5a5; --stage-line:#333333;
  --wave:#3ddc6f;
    --sky:#dce6eb; --ridge:#b3c6cc; --tree:#567578; --tree-dark:#36565d;
    --ground:#a7bab3; --frost:#edf3ef; --log:#6a7863; --fire:#d89240;
    --jacket:#315caf; --jacket-dark:#23457e; --stripe:#e2ebee; --letter:#f3d25d;
    --skin-a:#e6c3a5; --skin-b:#946c54; --skin-c:#c59771; --skin-d:#e4b9ad;
    --hair-a:#b7ad84; --hair-b:#363b42; --hair-c:#995b41; --hair-d:#e5d6ad;
    --face:#283b46; --bow:#b76480;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page:#0a0a0a; --surface:#1b1b1b; --soft:#2b2b2b; --ink:#f2f2f2;
  --muted:#a5a5a5; --line:#2f2f2f; --strong-line:#5a5a5a;
  --accent:#3ddc6f; --accent-soft:#163020; --on-accent:#04140a;
  --good:#3ddc6f; --good-soft:#163020; --review:#e8b85c; --review-soft:#3a2f18;
  --danger:#ff8a96; --focus:#6ee894; --clear:transparent; --shadow:#00000066;
  --stage:#000000; --stage-ink:#eeeeee; --stage-muted:#a5a5a5; --stage-line:#333333;
  --wave:#3ddc6f;
  --sky:#dce6eb; --ridge:#b3c6cc; --tree:#567578; --tree-dark:#36565d;
  --ground:#a7bab3; --frost:#edf3ef; --log:#6a7863; --fire:#d89240;
  --jacket:#315caf; --jacket-dark:#23457e; --stripe:#e2ebee; --letter:#f3d25d;
  --skin-a:#e6c3a5; --skin-b:#946c54; --skin-c:#c59771; --skin-d:#e4b9ad;
  --hair-a:#b7ad84; --hair-b:#363b42; --hair-c:#995b41; --hair-d:#e5d6ad;
  --face:#283b46; --bow:#b76480;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-underline-offset:4px}
button,a,input,select,textarea,summary{-webkit-tap-highlight-color:var(--clear)}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3,p,figure{margin:0}
h1{font-size:clamp(1.65rem,4vw,2.25rem);line-height:1.14;letter-spacing:-.04em;font-weight:650;overflow-wrap:anywhere}
h1[tabindex="-1"]:focus{outline:none}
h2{font-size:1.1rem;line-height:1.3;letter-spacing:-.02em}
h3{font-size:1rem}
ul,ol{padding:0;margin:0;list-style:none}
button{cursor:pointer}
button:disabled{opacity:.48;cursor:not-allowed}
button,a{touch-action:manipulation}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
.shell{max-width:1440px;margin:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
.top{display:flex;align-items:center;gap:18px;min-height:60px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--page);border-bottom:1px solid var(--line)}
.topline{display:contents}
.brand-name{display:none}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-size:.8rem;letter-spacing:.13em;font-weight:750;white-space:nowrap;min-width:0}
.brand-mark{width:22px;height:22px;border:2px solid var(--ink);display:grid;place-items:center;font:700 14px var(--mono);letter-spacing:0}
.topnav{display:flex;gap:20px;min-width:0;flex:1;order:1}
.topnav a{display:flex;align-items:center;min-height:60px;text-decoration:none;border-bottom:3px solid var(--clear);font-weight:600;color:var(--muted)}
.topnav a[aria-current]{color:var(--accent);border-color:var(--accent)}
.user{position:relative;min-width:0;order:2}
.user>button{display:flex;align-items:center;gap:8px;border:0;background:var(--clear);min-height:44px;padding:4px 0 4px 10px;font-size:.85rem}
.avatar{display:none;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--soft);font:12px var(--mono);color:var(--muted)}
.menu{position:absolute;right:0;top:48px;width:244px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px var(--shadow);padding:16px;z-index:30}
.menu a{display:flex;align-items:center;min-height:44px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line);margin-top:10px}
.menu legend{font-size:.75rem;color:var(--muted);margin-bottom:8px}
.theme-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.theme-options button{border:1px solid var(--line);background:var(--surface);border-radius:3px;min-height:44px;font-size:.8rem;padding:4px}
.theme-options button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.crumbs{display:flex;align-items:center;gap:8px;min-width:0;min-height:52px;color:var(--muted);font-size:.75rem;position:relative}
.crumbs a{color:var(--muted);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.crumbs .crumb-tail{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.crumb-wide{display:none}
.ancestor{position:relative;flex:none}
.ancestor>summary{cursor:pointer;display:grid;place-items:center;list-style:none;width:40px;height:40px;background:var(--soft);font-family:var(--mono);border-radius:3px}
.ancestor>summary::-webkit-details-marker{display:none}
.ancestor-list{position:absolute;left:0;top:46px;z-index:15;min-width:220px;background:var(--surface);border:1px solid var(--line);padding:8px 16px;box-shadow:0 8px 24px var(--shadow)}
.ancestor-list a{display:flex}
.example{font:10px var(--mono);color:var(--muted);border:1px solid var(--line);padding:3px 6px;white-space:nowrap}
.eyebrow{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
main{min-width:0}
.page-head{display:flex;flex-direction:column;gap:12px;margin-bottom:24px;min-width:0}
.page-head .meta{margin-top:4px}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:10px;min-width:0}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.stack-tight{display:flex;flex-direction:column;gap:8px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:.8rem;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;min-height:44px;padding:9px 15px;background:var(--surface);border:1px solid var(--strong-line);border-radius:3px;color:var(--ink);text-decoration:none;font-weight:600;font-size:.85rem;line-height:1.3;text-align:center}
.btn:hover:not(:disabled){background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){box-shadow:inset 0 0 0 2px var(--on-accent)}
.btn.quiet{border-color:var(--clear);background:var(--clear);color:var(--muted)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.icon{width:44px;padding:8px;font:18px var(--mono);flex:none}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.73rem;font-weight:600;color:var(--muted);width:fit-content}
.status::before{content:"";width:6px;height:6px;background:var(--muted);border-radius:50%;flex:none}
.status.good{color:var(--good)}.status.good::before{background:var(--good)}
.status.review{color:var(--review)}.status.review::before{background:var(--review)}
.status.working{color:var(--accent)}.status.working::before{background:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);padding:18px;min-width:0}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-block:28px 12px;min-width:0}
.section-head>div{min-width:0}
.tree-list{border-top:1px solid var(--line)}
.tree-link{display:flex;align-items:center;gap:18px;padding-block:20px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);min-width:0}
.tree-link>div{min-width:0;flex:1}
.tree-link h2{margin-bottom:6px}
.tree-link .arrow{color:var(--muted);font-size:22px}
.picker{width:100%;background:var(--clear);border:0;border-bottom:1px solid var(--line);text-align:left}.tree-link:hover h2{color:var(--accent)}
.team-mark{display:grid;place-items:center;flex:none;width:64px;height:76px;background:var(--jacket);color:var(--letter);font:700 25px var(--mono);border-bottom:5px solid var(--letter)}
.folder-mark{width:40px;height:32px;border:1px solid var(--strong-line);border-top:5px solid var(--strong-line);background:var(--soft);flex:none}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.filter{min-height:44px;padding:8px 10px;border:1px solid var(--line);background:var(--clear);border-radius:3px;font-size:.77rem}
.filter[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.empty{padding:36px 18px;text-align:center;border:1px dashed var(--strong-line);color:var(--muted)}
.hero{display:grid;grid-template-columns:112px minmax(0,1fr);gap:20px;align-items:start}
.hero-info{padding-block:6px;display:flex;flex-direction:column;gap:16px;min-width:0}
.hero-info strong{font-size:1.1rem;font-weight:600;line-height:1.3}
.hero-info .btn{align-self:start}
.art{aspect-ratio:9/16;background:var(--sky);overflow:hidden;position:relative;min-width:0}
.art svg{width:100%;height:100%;display:block}
.art.square{aspect-ratio:1}
.photo-label{position:absolute;bottom:8px;left:8px;font:10px var(--mono);background:var(--surface);color:var(--ink);padding:3px 6px}
.art .sky{fill:var(--sky)}.art .ridge{fill:var(--ridge)}.art .tree{fill:var(--tree)}
.art .tree-dark{fill:var(--tree-dark)}.art .ground{fill:var(--ground)}.art .frost{fill:var(--frost)}
.art .log{fill:var(--log)}.art .fire{fill:var(--fire)}.art .jacket{fill:var(--jacket)}
.art .jacket-dark{fill:var(--jacket-dark)}.art .stripe{fill:var(--stripe)}.art .letter{fill:var(--letter)}
.art .skin-a{fill:var(--skin-a)}.art .skin-b{fill:var(--skin-b)}.art .skin-c{fill:var(--skin-c)}.art .skin-d{fill:var(--skin-d)}
.art .hair-a{fill:var(--hair-a)}.art .hair-b{fill:var(--hair-b)}.art .hair-c{fill:var(--hair-c)}.art .hair-d{fill:var(--hair-d)}
.art .face{fill:var(--face)}.art .bow{fill:var(--bow)}.art .contour{fill:none;stroke:var(--face);stroke-width:1.5;stroke-linecap:round}
.art .seam{fill:none;stroke:var(--jacket-dark);stroke-width:1.5}
.art .fine{fill:none;stroke:var(--stripe);stroke-width:2}
.build-box{margin-block:22px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.build-box .row>div{min-width:0}
progress{display:block;width:100%;height:7px;appearance:none;border:0;background:var(--soft);accent-color:var(--accent)}
progress::-webkit-progress-bar{background:var(--soft)}progress::-webkit-progress-value{background:var(--accent)}progress::-moz-progress-bar{background:var(--accent)}
.board-list{border-top:1px solid var(--line)}
.board-item{display:grid;grid-template-columns:66px minmax(0,1fr);gap:12px;padding-block:16px;border-bottom:1px solid var(--line);min-width:0}
.board-item>div{min-width:0}
.board-item .art{width:66px}
.board-copy{display:flex;flex-direction:column;gap:8px;min-width:0}
.board-title{display:flex;align-items:baseline;gap:9px;min-width:0}
.board-title a{font-weight:650;color:var(--ink);text-decoration:none;overflow-wrap:anywhere}
.board-title a:hover{text-decoration:underline}
.board-number{font:12px var(--mono);color:var(--muted);flex:none}
.script-read{display:flex;flex-direction:column;gap:5px;font-size:.85rem}
.script-read li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:6px;min-width:0;overflow-wrap:anywhere}
.script-read .speaker{font:11px var(--mono);padding-top:3px;color:var(--muted)}
.board-tools{grid-column:2;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.board-tools .row{gap:4px}
.board-tools .btn{font-size:.8rem}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field-label{font-size:.75rem;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--strong-line);border-radius:3px;min-height:44px;padding:9px 10px;width:100%;min-width:0;max-width:100%}
textarea{resize:vertical;line-height:1.5}
input[type="number"]{font-family:var(--mono)}
.input-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.composer{border-top:1px solid var(--line);margin-top:20px;min-width:0}
.composer summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;font-size:.8rem;font-weight:600;color:var(--accent);cursor:pointer;list-style:none}
.composer summary::-webkit-details-marker{display:none}
.composer summary::after{content:"+";font-family:var(--mono)}
.composer[open] summary::after{content:"−"}
.composer .stack{padding-block:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:3px;min-height:44px;padding:7px 9px;font-size:.75rem;max-width:100%;overflow-wrap:anywhere}
.chip span{min-width:0}.chip b{font-size:16px;font-weight:400;flex:none}
.prompt-result{font-size:.75rem;color:var(--muted);padding:10px;border-left:2px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap}
.script-fields{display:flex;flex-direction:column;gap:16px}
.line-fields{display:grid;grid-template-columns:68px minmax(0,1fr);gap:10px;min-width:0}
.line-fields .line-action{grid-column:2;justify-self:end;min-height:32px;padding:4px 8px;font-size:.75rem}
.approval-bar{border-top:1px solid var(--line);padding-top:16px;margin-top:22px;display:flex;flex-direction:column;align-items:start;gap:10px}
.confirmation{grid-column:1/-1;padding:14px;border:1px solid var(--danger);background:var(--surface)}
.asset-controls{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;margin-bottom:16px}
.asset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}
.asset-card{min-width:0;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line);padding-bottom:16px}
.asset-card .art{aspect-ratio:4/3}
.asset-card h3{font-size:.85rem;overflow-wrap:anywhere}
.asset-card .btn{margin-top:auto}
.target-board{padding:12px;background:var(--soft);margin-bottom:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.target-board select{font-size:.8rem}
.generate-layout{display:grid;gap:24px;min-width:0}
.generate-preview{max-width:280px;width:100%;margin:auto}
.result-panel{border-top:2px solid var(--accent);padding-top:16px;margin-top:18px}
.notice{position:fixed;bottom:max(16px,env(safe-area-inset-bottom,0px));left:16px;right:16px;z-index:40;background:var(--ink);color:var(--surface);border:1px solid var(--strong-line);padding:12px 16px;max-width:540px;margin:auto;font-size:.82rem;box-shadow:0 4px 18px var(--shadow)}
.preview-strip{display:flex;flex-wrap:wrap;gap:6px}
.preview-strip button{min-width:44px;min-height:44px;background:var(--surface);border:1px solid var(--line);border-radius:3px;font:12px var(--mono)}
.preview-strip button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.cut-layout{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;margin-block:16px}
.cut-layout>div{min-width:0}
.media-folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.media-folders .tree-link{gap:12px}
.run-list{display:flex;flex-direction:column;gap:12px}
.run-item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.run-item .meta{gap:4px 12px;font-size:.73rem}
.run-select{padding:0;min-height:44px;border:0;background:var(--clear);font-weight:650;text-decoration:underline;text-underline-offset:4px;color:var(--accent)}
.run-select[aria-pressed="true"]{text-decoration-thickness:3px}
.compare-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-block:16px}
.compare-column{min-width:0;display:flex;flex-direction:column;gap:12px}
.compare-column strong{overflow-wrap:anywhere}
.compare-column .art{width:100%;max-width:180px}
.compare-column .empty{padding:24px 8px}
.compare-column .script-read{font-size:.8rem}
#cut-review{margin-top:24px;scroll-margin-top:84px}
.settings-row{display:flex;justify-content:space-between;gap:16px;padding-block:16px;border-bottom:1px solid var(--line);font-size:.85rem}
.settings-row>*{min-width:0}
@media(min-width:700px){
  .top{gap:36px;min-height:60px}.brand-name{display:inline}.avatar{display:grid}.topnav a{min-height:60px}
  .crumb-wide{display:contents}.ancestor{display:none}.crumbs{font-size:.8rem;gap:12px;min-height:60px}
  .page-head{flex-direction:row;align-items:center;justify-content:space-between;gap:24px}
  .hero{grid-template-columns:180px minmax(0,1fr);gap:28px}.hero-info{gap:22px;padding:16px 0}
  .hero-info strong{font-size:1.6rem}.hero{max-width:740px}
  .board-item{grid-template-columns:82px minmax(0,1fr) auto;gap:20px}.board-item .art{width:82px}
  .board-tools{grid-column:3;flex-direction:column;justify-content:start;align-items:end}
  .script-read{font-size:.9rem}.asset-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
  .asset-controls{max-width:700px}
  .target-board{flex-direction:row;align-items:center;gap:16px}.target-board select{width:auto;max-width:360px}
  .generate-layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cut-layout{grid-template-columns:150px minmax(0,1fr)}
  .compare-grid{gap:24px}
}
@media(min-width:900px){
      .story-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:36px;align-items:start}
  .story-layout>.build-box{margin:0;position:sticky;top:96px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* The editing surface is neutral; colour marks selection, audio or status. */
.crumbs{flex-wrap:wrap;gap:0 6px;padding-block:8px;min-height:52px;line-height:1.3}
.crumbs button{border:0;background:var(--clear);color:var(--muted);min-height:36px;padding:5px 2px;font-size:.77rem;max-width:100%;overflow-wrap:anywhere;text-align:left}
.crumbs button[aria-current]{color:var(--ink);font-weight:600}
.crumbs .example{margin-left:auto}
.page-head{margin-block:12px 24px}
.landing-grid{display:grid;gap:16px;max-width:900px}
.launch-card{padding:28px;display:flex;gap:24px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);color:var(--ink);text-decoration:none;min-width:0}
.launch-card:hover{border-color:var(--accent)}
.launch-card h2{margin-bottom:6px}.launch-card p{color:var(--muted);font-size:.85rem}
.launch-icon{font:24px var(--mono);color:var(--accent);padding-top:2px}
.create-form{margin-top:24px;max-width:520px;padding:18px;border:1px solid var(--line);background:var(--surface)}
.create-form .row{align-items:end}.create-form .field{flex:1 1 180px}
.workspace-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-block:8px 16px}
.workspace-head h1{font-size:1.25rem;letter-spacing:-.025em}
.workspace-head .meta{margin-top:4px}.workspace-head .row{gap:6px}
.workbench{display:grid;grid-template-areas:"stage" "timeline" "inspector";grid-template-columns:minmax(0,1fr);border:1px solid var(--line);background:var(--surface);min-width:0}
.tool-rail{display:none;grid-area:rail;border-right:1px solid var(--line);padding:6px 3px;flex-direction:column;align-items:center;gap:6px}
.tool-rail button{border:0;background:var(--clear);color:var(--muted);min-height:44px;width:40px;font:16px var(--mono);border-radius:3px}
.tool-rail button:hover{background:var(--soft);color:var(--ink)}
.stage{grid-area:stage;background:var(--stage);color:var(--stage-ink);min-width:0}
.stage-bar{padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:space-between;font:10px var(--mono);color:var(--stage-muted);border-bottom:1px solid var(--stage-line)}
.stage-picture{position:relative;display:flex;align-items:center;justify-content:center;padding:38px 16px 26px;height:332px;min-width:0}
.stage-picture>.art{height:100%;aspect-ratio:9/16;box-shadow:0 4px 24px var(--shadow)}
.stage-picture.wide>.art{width:100%;height:auto;max-width:calc(300px * 16 / 9);aspect-ratio:16/9}.stage-picture.wide>.art svg{object-fit:contain}
.stage-id,.stage-time,.stage-version{position:absolute;z-index:1;font:10px var(--mono);color:var(--stage-muted)}
.stage-id{left:12px;top:13px;color:var(--stage-ink)}.stage-time{right:12px;top:13px}.stage-version{bottom:8px;left:12px}
.audio-strip{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--stage-line);min-width:0}
.audio-strip button{border:1px solid var(--stage-line);background:var(--stage);color:var(--stage-ink);height:40px;min-width:40px;border-radius:3px}
.audio-strip .small{font-size:10px;font-family:var(--mono);color:var(--stage-muted);white-space:nowrap}
.wave{height:28px;min-width:0;width:100%;display:flex;gap:3px;align-items:center;overflow:hidden}
.wave i{display:block;background:var(--wave);flex:1;min-width:2px;max-width:6px;border-radius:1px}
.audio-strip .wave{flex:1}.wave.empty-wave{border-bottom:1px dashed var(--stage-line);height:1px}
.audio-strip.playing .wave{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.35}}
.timeline{grid-area:timeline;min-width:0;border-top:1px solid var(--line);padding:10px 12px 12px}
.timeline-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.timeline-head h2{font-size:.75rem}.timeline-head .btn{min-height:36px;padding:5px 9px;font-size:.75rem}
.filmstrip{display:flex;gap:8px;overflow-x:auto;overscroll-behavior-x:contain;padding:3px 3px 10px;scrollbar-color:var(--strong-line) var(--soft);min-width:0;max-width:100%}
.film-panel{flex:0 0 108px;display:flex;flex-direction:column;gap:5px;text-align:left;padding:6px;border:1px solid var(--line);border-radius:3px;background:var(--page);min-width:0}
.film-panel[aria-pressed="true"]{border:2px solid var(--accent);padding:5px;background:var(--accent-soft)}
.film-panel .thumb{height:65px;display:flex;justify-content:center;background:var(--stage)}
.film-panel .art{height:100%;width:auto;aspect-ratio:9/16}
.film-label{display:flex;justify-content:space-between;gap:3px;font:9px var(--mono)}
.film-title{font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;max-width:100%}
.film-panel .wave{height:12px;gap:2px}.film-panel .wave i{max-height:12px}
.inspector{grid-area:inspector;min-width:0;border-top:1px solid var(--line)}
.inspector-heading{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.inspector-heading h2{font-size:.85rem}.inspector-heading .mono{font-size:.7rem;color:var(--muted)}
.inspector-section{border-bottom:1px solid var(--line);min-width:0;scroll-margin-top:80px}

.inspector-section>summary::-webkit-details-marker{display:none}.inspector-section>summary::after{content:"+";font:16px var(--mono);color:var(--muted)}
.inspector-section[open]>summary::after{content:"−"}
.inspector-content{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.inspector .field label{font-size:.7rem}.inspector input,.inspector textarea,.inspector select{font-size:.8rem}
.inspector .line-fields{grid-template-columns:60px minmax(0,1fr);gap:8px}
.inspector .line-fields textarea{min-height:76px}
.inspector .line-action{min-height:32px}
.inspector .chip{min-height:36px;font-size:.7rem;padding:4px 8px}
.inspector .btn{font-size:.75rem;padding:7px 10px}
.inspector .script-fields{gap:12px}.inspector .small{font-size:.73rem}
.inspector .note-row{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:6px}
.note-row button{min-height:44px;border:1px solid var(--line);background:var(--clear);color:var(--muted);border-radius:3px}
.note-row input{min-width:0}
.voice-timing{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.73rem;color:var(--muted)}
.inspector-footer{padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap}
.inspector-footer .btn{min-height:40px}
.asset-audio{aspect-ratio:4/3;background:var(--stage);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:12px;color:var(--stage-ink)}
.asset-audio .mono{font-size:.75rem}
.library-scope{margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.library-scope .chip{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
#runs{scroll-margin-top:80px}.runs-area{margin-top:22px}
@media(min-width:700px){
  .shell{padding-inline:24px}.landing-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .crumbs{min-height:52px}.top{gap:28px}.topnav a{min-height:60px}
}

  .workbench{grid-template-areas:"rail stage inspector" "timeline timeline inspector";grid-template-columns:48px minmax(0,1fr) 336px;grid-template-rows:456px 210px}
  .tool-rail{display:flex}.stage-picture{height:364px}.stage-bar{height:36px}
  .inspector{border-top:0;border-left:1px solid var(--line);overflow-y:auto;max-height:666px;scrollbar-color:var(--strong-line) var(--surface)}
  .timeline{padding-top:10px}.film-panel .thumb{height:68px}
  .runs-area{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
  .runs-area .build-box{margin:0}.runs-area #cut-review{margin-top:0}
}
/* v5: Backstage-style shapes (pill actions, rounded cards). */
.btn,.filter,.theme-options button{border-radius:999px}
.btn{font-weight:600}
.btn{background:var(--clear)}
.panel,.launch-card,.film-panel,.chip,.preview-strip button,input,select,textarea{border-radius:6px}
.launch-card,.panel{border-radius:8px}
.add-media{margin-top:16px}

  }
  if(action==='move'){
    const index=boards.findIndex(x=>x.id===el.dataset.id),next=index+Number(el.dataset.direction);if(index<0||next<0||next>=boards.length)return;
    const [moved]=boards.splice(index,1);boards.splice(next,0,moved);render(el.id);revealSelected();return;
  }
  if(action==='remove-ask'){state.remove=b?.id;render();$('[data-action="remove-cancel"]')?.focus();return;}
  if(action==='remove-cancel'){state.remove=null;render();return;}
  if(action==='remove-confirm'){
    const i=boards.findIndex(x=>x.id===el.dataset.id);if(i<0)return;
    boards.splice(i,1);state.remove=null;state.selected=boards[Math.min(i,boards.length-1)]?.id||null;
    if(state.assetBoard===el.dataset.id)state.assetBoard=null;go(state.selected?'board-'+state.selected:'editor-board');return;
  }
  if(action==='add-line'){if(!b)return;b.lines.push(line('a',''));b.method='talking';updateVoice(b);openPanel('script-section');render('text-'+b.lines.at(-1).id);return;}
  if(action==='remove-line'){if(!b)return;b.lines=b.lines.filter(l=>l.id!==el.dataset.id);if(!b.lines.length)b.method='reaction';updateVoice(b);render('action-add-line');return;}
  if(action==='add-note'){if(!b)return;b.notes.push('');openPanel('notes-section');render('note-'+(b.notes.length-1));return;}
  if(action==='remove-note'){if(!b)return;b.notes.splice(Number(el.dataset.index),1);render('action-add-note');return;}
  if(action==='agent-fill'){
    if(!b||b.lines.length)return;b.title='Reaction close-up';b.method='reaction';b.hold=1.9;b.assets=['cast-d','jacket','campsite','squishy'];
    b.prompt='Close-up of D, shocked. Face fills the upper frame. No foreground log.';b.notes=['Sting','Slow push-in'];b.agent=true;b.photoDirty=true;syncDuration(b);render();notify('Agent draft · simulated.');return;
  }
  if(action==='remove-asset'){if(!b)return;b.assets=b.assets.filter(id=>id!==el.dataset.id);b.photoDirty=true;render();return;}
  if(action==='add-asset'){
    if(!b||b.assets.includes(el.dataset.id))return;b.assets.push(el.dataset.id);b.photoDirty=true;render('asset-target');notify('Asset added. Regenerate the reference photo.');return;
  }
  if(action==='photo-generate'){
    if(!b||b.photoBusy)return;if(!b.prompt.trim()){notify('Write a photo prompt first.');$('#photo-prompt')?.focus();return;}
    b.photoBusy=true;const input={assets:[...b.assets],prompt:b.prompt};render();
    setTimeout(()=>{b.photoBusy=false;b.photo++;b.photoInput=input;b.photoDirty=JSON.stringify(input)!==JSON.stringify({assets:b.assets,prompt:b.prompt});if((workspaceRoute()&&boards.includes(b))||state.route==='editor-assets'||state.route==='media-winter-menu')render();notify('Reference photo updated · simulated.');},1300);return;
  }
  if(action==='voice-generate'){
    if(!b||b.voice.busy||!b.lines.length)return;
    if(!b.lines.some(l=>l.text.trim())){notify('Add dialogue first.');openPanel('script-section');render('text-'+b.lines[0].id);return;}
    stopVoice();b.voice.busy=true;const input=voiceSignature(b);
    // Illustrative duration from frozen sample text, never measured or synthesized audio.
    const words=b.lines.reduce((n,l)=>n+l.text.trim().split(/\s+/).filter(Boolean).length,0);
    const duration=Number(Math.max(.4,words/2.8+b.lines.length*.15).toFixed(2));render();
    setTimeout(()=>{b.voice.busy=false;b.voice.version++;b.voice.seconds=duration;b.voice.input=input;updateVoice(b);if((workspaceRoute()&&boards.includes(b))||state.route==='editor-assets'||state.route==='media-winter-menu')render();notify('Voice updated · simulated.');},1000);return;
  }
  if(action==='voice-play'){playVoice(b);return;}
  if(action==='build-start'){startBuild();return;}
  if(action==='run-view'){viewRun(Number(el.dataset.number));return;}
  if(action==='preview-board'){if(state.compare)state.compare.preview=Number(el.dataset.index);else state.preview=Number(el.dataset.index);render();return;}
  if(action==='compare-start'){const done=finishedRuns();if(done.length<2)return;state.compare={left:done.at(-2).number,right:done.at(-1).number,preview:0};render();$('#cut-review')?.scrollIntoView({block:'start'});return;}
  if(action==='compare-close'){state.compare=null;render('action-compare-start');return;}
  if(action==='cut-approve'){const run=currentRun();if(!run||run.approved)return;run.approved=true;render();notify(`Run ${pad(run.number)} approved for go-live · example only.`);return;}
  if(action==='asset-generate'){
    const g=state.gen;if(g.busy||!g.name.trim()||!g.prompt.trim())return;
    g.busy=true;const input={name:g.name.trim(),kind:g.kind,prompt:g.prompt,labels:state.assetScope?[state.assetScope]:[],variant:(g.result?.variant||0)+1};render();
    setTimeout(()=>{g.result={...input,promoted:false};g.busy=false;if(state.route==='asset-generate')render('asset-generate-button');notify('Asset generated · simulated.');},1300);return;
  }
  if(action==='asset-promote'){
    const g=state.gen,r=g.result;if(!r||r.promoted||g.busy)return;
    assets.push({id:'asset-'+(++sequence),name:r.name,kind:r.kind,prompt:r.prompt,variant:r.variant,labels:r.labels,doll:r.kind==='cast'?'a':undefined});r.promoted=true;
    state.assetBoard=null;state.assetKind='all';state.search='';render();notify('Promoted to the asset library.');return;
  }
});
document.addEventListener('input',event=>{
  const el=event.target,b=selected(),id=el.id;
  if(el.closest('[data-create]')){el.setCustomValidity('');return;}
  if(id==='asset-search'){
    state.search=el.value;const t=document.createElement('template');t.innerHTML=libraryView();$('#asset-results').innerHTML=t.content.querySelector('#asset-results').innerHTML;$('#asset-count').textContent=t.content.querySelector('#asset-count').textContent;saveSelections();return;
  }
  if(['asset-name','asset-prompt'].includes(id)){
    const g=state.gen;if(g.busy)return;g[id==='asset-name'?'name':'prompt']=el.value;
    if(g.result){g.result=null;$('.generate-preview').innerHTML='<div class="empty">Asset preview</div>';}
    $('#asset-generate-button').textContent='Generate asset';$('#asset-generate-button').disabled=!g.name.trim()||!g.prompt.trim();return;
  }
  if(!b)return;
  if(id==='board-name')b.title=el.value;
  else if(id==='board-hold'){
    if(!el.validity.valid||!el.value)return;b.hold=Number(el.value);syncDuration(b);
  }else if(id==='photo-prompt'){b.prompt=el.value;b.photoDirty=true;}
  else if(id.startsWith('text-line-')){const l=b.lines.find(l=>l.id===el.dataset.line);if(l){l.text=el.value;updateVoice(b);}}
  else if(el.dataset.note!==undefined)b.notes[Number(el.dataset.note)]=el.value;
  else return;
  refreshBoard();
});
document.addEventListener('change',event=>{
  const el=event.target,b=selected();
  if(el.id==='asset-kind'){state.assetKind=el.value;render(el.id);}
  else if(el.id==='asset-target'){
    state.selected=el.value;if(state.assetBoard)state.assetBoard=el.value;render(el.id);
  }else if(el.id==='new-asset-kind'&&!state.gen.busy){state.gen.kind=el.value;state.gen.result=null;render(el.id);}
  else if(state.compare&&['compare-left','compare-right'].includes(el.id)){
    const side=el.id.slice(8),number=Number(el.value),other=side==='left'?'right':'left';
    if(finishedRuns().some(r=>r.number===number)&&number!==state.compare[other]){state.compare[side]=number;state.compare.preview=0;render(el.id);}
  }else if(b){
    if(el.id==='board-method'){b.method=el.value;refreshBoard();}
    else if(el.id==='voice-style'){b.voiceStyle=el.value;updateVoice(b);refreshBoard();}
    else if(el.id==='board-hold'&&(!el.validity.valid||!el.value)){el.value=b.hold;}
    else if(el.id.startsWith('speaker-line-')){const l=b.lines.find(l=>l.id===el.dataset.line);if(l){l.speaker=el.value;updateVoice(b);refreshBoard();}}
  }
});
document.addEventListener('toggle',event=>{
  const el=event.target;if(el.matches('details[data-panel]')&&el.isConnected){state.panels[state.route+':'+el.id]=el.open;saveSelections();}
},true);
route();
})();
</script>
