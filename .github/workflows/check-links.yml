name: Check links

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Unit test
        run: python3 -m unittest scripts/checks/test_check_links.py
      - name: Check relative Markdown links
        run: python3 scripts/checks/check_links.py .
