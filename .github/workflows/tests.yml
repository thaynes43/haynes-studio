name: Tests

# Suites and limits: docs/process/testing.md and contract section 14
# (docs/contracts/studio-contracts-v1.md). No secrets; read-only token.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  STUDIO_THREADS: "2"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "1"
  UV_PYTHON_DOWNLOADS: never

jobs:
  source:
    name: source (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Install locked dependencies
        run: uv sync --locked --python "${{ matrix.python }}"

      - name: Run the source suite
        run: uv run --no-sync pytest

  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # postgres:16 pinned by its index digest (looked up on Docker Hub, 2026-11-13);
        # to refresh, see docs/process/testing.md.
        image: postgres:16@sha256:63e83b5a3dc36a917dccb76fe1bd2ac51f1ec9c1deb47ff20d4f04233bf6eae9
        env:
          POSTGRES_DB: studio_test
          # A throwaway container: trust auth means no password exists to reach the log.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studio_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      STUDIO_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/studio_test
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"

      - name: Install locked dependencies
        run: uv sync --locked --python 3.12

      - name: Run the db suite
        run: uv run --no-sync pytest -m db --require-db

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm typecheck

      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: Run the browser suite
        run: pnpm test:e2e
