name: Check no media

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-no-media:
    name: Check no media
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Run unit test
        run: python3 -m unittest scripts/checks/test_check_no_media.py

      - name: Check tracked files
        run: python3 scripts/checks/check_no_media.py
