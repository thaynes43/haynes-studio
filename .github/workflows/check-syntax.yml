name: Check syntax

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run unit tests
        run: python3 -m unittest scripts/checks/test_check_syntax.py
      - name: Check repository syntax
        run: python3 scripts/checks/check_syntax.py
